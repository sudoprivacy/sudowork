name: "/model slash command autocomplete"
description: "Type / in chat input, verify /model appears in autocomplete dropdown"
tags: [no-api]

steps:
  - op: wait_for_app_ready
    timeout: 300

  # Type / to trigger autocomplete
  - op: type_text
    text: "/"
  - op: pause
    duration: 2000

  # Verify autocomplete dropdown shows /model
  - op: screenshot
    path: "screenshots/slash-command-model-autocomplete.png"
  - op: judge
    expect: "model"
