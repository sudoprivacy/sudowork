# Include inside the WebUI server block; keep authenticated routes separate.
location /assets/ {
    proxy_pass http://webui:26808;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/wasm image/svg+xml;

    proxy_hide_header Cache-Control;
    add_header Cache-Control $sudowork_static_cache_control always;
}
