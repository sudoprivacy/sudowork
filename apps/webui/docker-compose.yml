# Sudowork WebUI Compose（计划 3.12）：
# postgres（healthcheck）→ migrate（一次性）→ webui；Moss 为外部服务（只读配置）。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sudowork_webui}
    volumes:
      - webui-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sudowork_webui}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: &webui-image ${WEBUI_IMAGE:-${COMPOSE_PROJECT_NAME:-sudowork-webui}-webui}
    build: &webui-build
      context: ../..
      dockerfile: apps/webui/Dockerfile
    command: ['node', 'dist/server/migrate.js']
    environment: &webui-env
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sudowork_webui}
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY}
      TOKEN_AES_KEY: ${TOKEN_AES_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      # This compose normally sits behind an nginx/Caddy layer. Left off, req.ip
      # is always the gateway's address and the login rate limit (10 per 15
      # minutes) is shared by every user of the deployment.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      MOSS_BASE_URL: ${MOSS_BASE_URL}
      MOSS_WS_BASE_URL: ${MOSS_WS_BASE_URL}
      MOSS_ALLOWED_ORIGINS: ${MOSS_ALLOWED_ORIGINS:-}
      PORT: '26808'
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  publish-assets:
    image: *webui-image
    build: *webui-build
    command:
      [
        'node',
        'dist/server/publishAssets.js',
        '--target',
        '/retained-assets',
        '/app/apps/webui/dist/client/assets',
      ]
    volumes:
      - webui-assets:/retained-assets
    restart: 'no'

  webui:
    image: *webui-image
    build: *webui-build
    environment:
      <<: *webui-env
      CSP_IMG_SRC_ORIGINS: ${CSP_IMG_SRC_ORIGINS:-}
    ports:
      - '${WEBUI_PORT:-26808}:26808'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      publish-assets:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: webui-assets
        target: /app/apps/webui/dist/client/assets
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:26808/health/live'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  webui-pgdata:
  webui-assets:
