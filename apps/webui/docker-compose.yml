# Sudowork WebUI Compose（计划 3.12）：
# postgres（healthcheck）→ migrate（一次性）→ webui；Moss 为外部服务（只读配置）。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sudowork_webui}
    volumes:
      - webui-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sudowork_webui}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: &webui-build
      context: ../..
      dockerfile: apps/webui/Dockerfile
    command: ['node', 'dist/server/migrate.js']
    environment: &webui-env
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sudowork_webui}
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY}
      TOKEN_AES_KEY: ${TOKEN_AES_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      MOSS_BASE_URL: ${MOSS_BASE_URL}
      MOSS_WS_BASE_URL: ${MOSS_WS_BASE_URL}
      PORT: '26808'
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  webui:
    build: *webui-build
    environment:
      <<: *webui-env
      CSP_IMG_SRC_ORIGINS: ${CSP_IMG_SRC_ORIGINS:-}
    ports:
      - '${WEBUI_PORT:-26808}:26808'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(''http'').get(''http://127.0.0.1:26808/health/live'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  webui-pgdata:
