[project]
name = "hook"
version = "0.0.1"
description = "Security hook in Python"
requires-python = ">=3.8"
dependencies = [
    "urllib3>=2.2.3",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=24.8.0",
    "httpx>=0.28.1",
    "requests>=2.32.4",
]
