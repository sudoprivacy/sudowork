[package]
name = "nexus-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi9", "tokio_rt"] }
napi-derive = "3"
nexus-vfs-client = { git = "https://github.com/sudoprivacy/sudocode", rev = "0686ed9b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "3"

[profile.release]
lto = true
strip = "symbols"
