[package]
name = "nexus-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"
nexus-vfs-client = { git = "https://github.com/sudoprivacy/sudocode", rev = "0686ed9b" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
