name: "nexus tool: read_file"
description: "Verify Nexus agent can read files via read_file tool and render tool call UI"

steps:
  - op: wait_for_app_ready
    timeout: 300

  - op: mouse_click
    text: "新会话"
  - op: pause
    duration: 3000

  - op: mouse_click
    text: "Nexus"
  - op: pause
    duration: 2000

  # Ask to read a known file
  - op: type_text
    text: "Use the read_file tool to read /workspace/package.json and tell me the project name field."
  - op: press_key
    key: "Enter"
    wait: 3

  - op: wait_for_response
    timeout: 60

  # Verify tool was called and result rendered
  - op: screenshot
    path: "screenshots/nexus-02-read-file.png"
  - op: judge
    expect: "read_file package.json"
