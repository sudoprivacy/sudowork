name: "ACP session survives any per-request error (PR-A regression guard)"
locale: zh-CN  # asserts Chinese error copy (e.g. "请求超时") in the chat
description: >
  Regression test for the bug 进二 hit 2026-06-28: an oversized payload
  (image attach in his case) tripped single_request_too_large, which
  PRE-FIX caused AcpAgent.markRuntimeContextPoisoned to delete the ACP
  session — silently dropping full chat history on every retry.

  POST-FIX (PR #941): the classifier returns recoverableByNewSession=false
  for single_request_too_large; both poisoning sites in AcpAgent.ts
  (response-error and streamed-error) gate on that flag, so the session
  is preserved.

  ## What this test asserts

  PR-A's load-bearing claim is broader than just single_request_too_large:
  **NO per-request error should tear down the ACP session**. This includes
  scode-process-disconnect, gRPC timeout, request_body_too_large, and
  single_request_too_large. They all should leave acpSessionId alive and
  prior chat history intact.

  This test is intentionally agnostic to which specific error fires.
  Triggering single_request_too_large deterministically from the LLM
  requires either a 25MB+ image paste (no programmatic op for clipboard-
  binary-paste in the framework yet — see Followup) or a payload that
  fits scode but exceeds the model's per-request token cap (varies by
  model). A 200KB text injection reliably trips SOME error path; what
  PR-A guarantees is that the session survives whichever path.

  ## Verified manually 2026-06-28

  Driven via ai-dev-browser against sudowork dev at port 9230,
  conversation 78d6e31c (Sudo Code backend, acpSessionId
  `session-1781238647965-0`):

  1. Phase 1: send "remember the number 47" → assistant ACKs
  2. Phase 2: inject 200KB text → "scode process disconnected" /
     "请求超时" tip
  3. Phase 3: send "what number?" → assistant recalls "47"
  4. DB snapshot before/after: acpSessionId UNCHANGED (proves session
     preserved through the error)

  ## Followup (not blocking this test)

  A targeted PR-A test for the ACTUAL single_request_too_large path
  (image-paste at 25MB+) requires either:
    - a new e2e op `paste_clipboard_image_file <path>` that puts a file
      on the OS clipboard + dispatches a real ClipboardEvent with the
      image as DataTransfer (sudowork's renderer paste handler reads
      from event.clipboardData, not via OS clipboard re-fetch)
    - or a `programmatic_attach_image <path>` op that calls sudowork's
      IPC bridge directly to push an image into the chat
  Neither op exists today. The current test covers PR-A's broader claim
  via a deterministic-to-trigger proxy error.

tags: [api, smoke]

steps:
  # ── Phase 0: app + Sudo Code backend setup ──
  # Mirrors scode-basic-conversation's bootstrap (proven to work in CI).
  - op: wait_for_app_ready
    timeout: 300

  - op: click
    x: 530
    y: 27
  - op: pause
    duration: 3000
  - op: mouse_click
    text: "Sudo Code"
  - op: pause
    duration: 3000
  - op: screenshot
    path: "screenshots/acp-spe-00-conversation-ready.png"

  # ── Phase 1: seed memorable context ──
  # The model has to recall this exact number in Phase 3 to prove the
  # session wasn't torn down. Number chosen to be unambiguous and not
  # likely to appear coincidentally in any response.
  - op: type_text
    text: "Please remember the number 47 for the rest of this conversation. Acknowledge with one short sentence."
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 60
  - op: screenshot
    path: "screenshots/acp-spe-01-seed.png"
  - op: judge
    expect: "Assistant acknowledges or echoes the number 47"

  # ── Phase 2: trigger an error via 200KB text injection ──
  # type_text would type one character at a time (slow + risks intermediate
  # React state). js_eval sets the textarea value via the native setter +
  # dispatches input event so React state updates atomically. Then press
  # Enter to send.
  - op: js_eval
    code: |
      (() => {
        const ta = document.querySelector('textarea');
        if (!ta) return { ok: false, reason: 'no textarea found' };
        const setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
        const big = 'overflow test '.repeat(15000); // ~180KB — large enough to trip scode handling
        setter.call(ta, big);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        return { ok: true, injected_bytes: big.length };
      })()
  - op: press_key
    key: "Enter"
    wait: 3
  - op: pause
    duration: 25000
  - op: screenshot
    path: "screenshots/acp-spe-02-after-oversize-error.png"
  - op: judge
    expect: >
      An error indication is visible in the chat (e.g. "请求超时",
      "scode process disconnected", or a RuntimeErrorBanner per-class
      copy). The exact error class doesn't matter — what matters is
      Phase-1's user message + assistant reply remain visible in the
      scrollback above the error tip.

  # ── Phase 3: CRITICAL — prove session is NOT torn down ──
  # If PR-A's classifier SSOT fix is working, the ACP session is still
  # alive, the model still has Phase 1's "remember 47" in context, and
  # it should answer with "47".
  #
  # Pre-fix this would FAIL because markRuntimeContextPoisoned would
  # have deleted acpSessionId after Phase 2's error → next message starts
  # a brand-new ACP session with no memory of Phase 1 → the assistant
  # would say "I don't have prior context" or fabricate a different
  # number.
  - op: type_text
    text: "What number did I ask you to remember? Reply with just the number."
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 60
  - op: screenshot
    path: "screenshots/acp-spe-03-recall.png"
  - op: judge
    expect: >
      Assistant reply contains "47" (the number from Phase 1). This
      proves the ACP session is the SAME session as before the Phase 2
      error — context preserved end-to-end. If the reply says "I don't
      have prior context", fabricates a different number, or repeats
      the error tip, PR-A's session-preservation contract is BROKEN.
