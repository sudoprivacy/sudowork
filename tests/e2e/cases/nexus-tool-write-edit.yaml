name: "nexus tool: write + edit + read roundtrip"
description: "Verify write_file creates a file, edit_file modifies it, read_file confirms"

steps:
  - op: wait_for_app_ready
    timeout: 300

  - op: mouse_click
    text: "新会话"
  - op: pause
    duration: 3000

  - op: mouse_click
    text: "Nexus"
  - op: pause
    duration: 2000

  # Step 1: Write a file
  - op: type_text
    text: "Use write_file to create /workspace/e2e_test.txt with content: ORIGINAL_CONTENT_E2E"
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-04-write.png"

  # Step 2: Edit the file
  - op: type_text
    text: "Use edit_file to replace ORIGINAL with MODIFIED in /workspace/e2e_test.txt"
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-05-edit.png"

  # Step 3: Read back to verify
  - op: type_text
    text: "Use read_file to read /workspace/e2e_test.txt and show the content"
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-06-read-verify.png"
  - op: judge
    expect: "MODIFIED_CONTENT_E2E"
