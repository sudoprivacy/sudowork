name: "lis8 verify patches"
description: "Full lis8 flow: login (with captcha) → nav to 新单录入 → fill form. Same prompt the user has been running manually. Verifies post-patch behaviour end-to-end on a real flow with compound cmds, browser/exec/read/write tool calls, no canvas."

steps:
  # ── Phase 0: Wait for app startup ──
  - op: wait_for_app_ready
    timeout: 300

  # ── Phase 1: Verify home screen is ready ──
  - op: screenshot
    path: "screenshots/lis8-verify-00-home.png"

  # ── Phase 2: Send the exact same prompt the user has been using ──
  - op: type_text
    text: |
      https://lis8.sinosoft.ltd
      用户名: tuanxiancs
      密码: admin001
      机构选 861100
      团险业务-新单管理-新单录入

      你登录进去看一下
  - op: press_key
    key: "Enter"
    wait: 3

  # ── Phase 3: Long run — captcha + login + nav + form takes 5–10 min ──
  - op: wait_for_response
    timeout: 1500

  # ── Phase 4: Final screenshot ──
  - op: screenshot
    path: "screenshots/lis8-verify-01-result.png"

  # ── Phase 5: DB audit (外援 verification, not UI-drive) ──
  # Counts agent tool calls since case_start and asserts on v0.8.3/v0.8.4 markers.
  # max_tool_calls is a soft-ish budget — past runs: v0.8.0=29, v0.8.1=65, v0.8.3=4
  # (last was a cheat — browser was pre-logged-in). 50 gives headroom for a real
  # lis8 run without rewarding regressions.
  - op: db_audit
    max_tool_calls: 50
    assert_metrics:
      # v0.8.4 rich-return actually reaches the trace when js_evaluate is used.
      # We don't assert js_evaluate_calls > 0 because if the LLM steers via
      # find_by_text / click_by_ref (the desired path), 0 is correct.
      js_evaluate_with_navigated: ">= 0"
      js_evaluate_with_console: ">= 0"
      # Fallback python scripts (navigate.py cascade) should be 0 post-v0.8.0.
      python_scripts: "== 0"

