name: "ACP image attachment never surfaces a wrong-model / oversized tip (image-handling-non-user-facing design)"
description: >
  Regression guard for the design at
  https://s.shareone.vip/s/image-handling-non-user-facing (Decisions 1 + 2).

  ## What this test asserts

  When the user attaches an image to a conversation:

    1. Vision model + small image → native pass-through, response references
       the image content.
    2. Vision model + ~8MB image → sudowork's tryReadAsImage preflight
       downsamples; response still references the image content.
    3. Text-only model + image → sudocode's `_meta.sudocode.imageCapability`
       advertisement carries `autoHandlesWrongModel: true`; sudowork skips
       the legacy "当前模型 X 不支持图片分析" tip and hands off silently.
       Sudocode's push_images runs the VLM-route (gemini-2.5-flash by
       default) and substitutes a description. Response references the image.

  The CRITICAL invariant across all three: user never sees a size/wrong-model
  error, conversation continues, assistant responds about the image content.

  ## Coverage matrix

    | Layer | Scope | Where |
    |---|---|---|
    | unit | parseImageCapability shapes, getImageTargetSize resolution | tests/unit/imageUtils.test.ts |
    | mocked integration | push_images VLM branch w/ mock sudorouter | sudocode acp_wrong_model_vlm_full_roundtrip |
    | live-e2e (this file) | full sudowork UI → scode → sudorouter roundtrip | steps below |

  ## Fixture strategy

  Images are generated by `paste_clipboard_image_file` on the harness side
  and dispatched as a real ClipboardEvent — matches how a human paste
  reaches sudowork's PasteService. Pathological/oversized coverage lives in
  the mocked-integration layer where the harness controls sudorouter's
  reply (real sudorouter has a hard body limit that would reject 25MB+
  bytes before the VLM leg even fires).

tags: [api, image]

steps:
  - op: wait_for_app_ready
    timeout: 300

  # ── Phase A: vision model + small image ──────────────────────────────
  # Native fast-path: sudowork sends bytes as-is (or lightly downsamples),
  # scode preflight passes, gemini-3-flash-preview describes directly.
  - op: mouse_click
    text: "auto"
  - op: pause
    duration: 1200
  - op: mouse_click
    text: "gemini-3-flash-preview"
  - op: pause
    duration: 1500
  - op: paste_clipboard_image_file
    path: "tests/e2e/fixtures/img-small-3shapes.png"
    wait: 2
  - op: type_text
    text: "In ONE short sentence: what shapes and colors are in this image?"
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 90
  - op: screenshot
    path: "screenshots/acp-image-A-small-vision.png"
  - op: judge
    expect: >
      Assistant reply mentions at least two of: "red", "blue", "yellow",
      "circle", "rectangle", "square". Confirms native pass-through reached
      the vision model.

  # ── Phase B: vision model + medium image → preflight downsample ────
  # sudowork's tryReadAsImage resizes 7-10MB PNG to under session cap,
  # scode preflight passes, gemini names the quadrants.
  - op: paste_clipboard_image_file
    path: "tests/e2e/fixtures/img-medium-4quadrants.png"
    wait: 3
  - op: type_text
    text: "This image is split into 4 quadrants. Name the 4 colors in ONE short sentence."
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 120
  - op: screenshot
    path: "screenshots/acp-image-B-medium-vision.png"
  - op: judge
    expect: >
      Assistant reply names all four quadrant colors — some combination of
      red, green, blue, yellow. Confirms preflight downsample preserved
      enough detail for the vision model to distinguish quadrants.

  # ── Phase C: text-only model + image → VLM route silent handoff ─────
  # This is the headline case: sudowork sees autoHandlesWrongModel=true
  # from scode's initialize _meta, skips the legacy "不支持图片分析" tip,
  # hands off silently. scode's push_images routes via VLM
  # (gemini-2.5-flash), splices a description, deepseek relays it.
  - op: mouse_click
    text: "gemini-3-flash-preview"
  - op: pause
    duration: 1200
  - op: mouse_click
    text: "deepseek-v4-flash"
  - op: pause
    duration: 1500
  - op: paste_clipboard_image_file
    path: "tests/e2e/fixtures/img-small-3shapes.png"
    wait: 2
  - op: type_text
    text: "Describe this image in ONE short sentence, naming the colors."
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 120
  - op: screenshot
    path: "screenshots/acp-image-C-textonly-vlm.png"
  - op: assert_not_contains
    forbidden: "不支持图片分析"
    reason: >
      Sudowork MUST NOT emit the legacy "当前模型 X 不支持图片分析" tip when
      scode advertises autoHandlesWrongModel=true. Seeing it means the
      capability parse regressed — bug pattern documented in
      memory/project_image_handling_capability_gap.md.
  - op: judge
    expect: >
      Assistant reply mentions at least one of: "red", "yellow", "blue",
      "cyan", "square", "circle" — confirms scode's VLM route delivered a
      description that the text-only model relayed.
