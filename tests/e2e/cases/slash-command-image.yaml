name: '/image slash command autocomplete'
description: 'Type / in chat input, verify /image appears in autocomplete dropdown'
tags: [no-api]

steps:
  - op: wait_for_app_ready
    timeout: 300

  # Type / to trigger autocomplete
  - op: type_text
    text: '/'
  - op: pause
    duration: 2000

  # Verify autocomplete dropdown shows /image
  - op: screenshot
    path: 'screenshots/slash-command-image-autocomplete.png'
  - op: judge
    expect: 'image'
