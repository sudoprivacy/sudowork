name: "doctor self-diagnosis"
description: "Doctor (Sudo Code + yolo) freely explores SudoWork UI within a time budget, then we judge whatever it accomplished"

steps:
  # ── Phase 0: Wait for app startup to complete ──
  - op: wait_for_app_ready
    timeout: 300

  # ── Phase 1: Clean state ──
  - op: mouse_click
    text: "新会话"
  - op: pause
    duration: 3000
  - op: screenshot
    path: "screenshots/doctor-00-home.png"
  - op: judge
    expect: "新会话 Sudo Code"

  # ── Phase 2: Select doctor preset (routes to Sudo Code backend) ──
  - op: mouse_click
    text: "诊断医生"
  - op: pause
    duration: 2000
  - op: screenshot
    path: "screenshots/doctor-01-selected.png"

  # ── Phase 3: Send bounded task ──
  - op: type_text
    text: "你有 7 分钟做一次快速自检。请在新会话页面测试 agent 切换：截图看有哪些 agent，逐个点击切换并截图验证。7 分钟后会被中断，请合理安排时间，留时间写总结。"
  - op: press_key
    key: "Enter"
    wait: 3

  # ── Phase 4: Let doctor work for 7 minutes ──
  - op: wait_for_response
    timeout: 420

  # ── Phase 5: Navigate back to doctor conversation before warning ──
  - op: mouse_click
    text: "你有 7 分钟做一次快速自"
  - op: pause
    duration: 2000

  # ── Phase 6: Warn before stopping ──
  - op: type_text
    text: "时间到了，请立即停止当前操作，输出你的诊断总结报告。你有 30 秒。"
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30

  # ── Phase 7: Force stop ──
  - op: stop_conversation
  - op: pause
    duration: 3000

  # ── Phase 8: Judge ──
  - op: screenshot
    path: "screenshots/doctor-02-result.png"
  - op: judge
    expect: "screenshot agent 切换 Sudo Code"
