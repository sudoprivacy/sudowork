# E2E Test for Channel Credential Backfill
# This test verifies that saved credentials are correctly backfilled when reopening settings.
#
# Prerequisites:
# - Application must be running
# - Telegram bot token should be configured (or provide via env: TELEGRAM_BOT_TOKEN)
# - Lark credentials should be configured (or provide via env: LARK_APP_ID, LARK_APP_SECRET)
# - DingTalk credentials should be configured (or provide via env: DINGTALK_CLIENT_ID, DINGTALK_CLIENT_SECRET)
#
# Note: This test uses placeholder tokens. Replace with actual values for testing.
# Environment variables can be used:
#   TELEGRAM_BOT_TOKEN - Telegram bot token
#   LARK_APP_ID - Lark App ID
#   LARK_APP_SECRET - Lark App Secret
#   DINGTALK_CLIENT_ID - DingTalk Client ID
#   DINGTALK_CLIENT_SECRET - DingTalk Client Secret

name: "Channel Credential Backfill"
description: "Test credential backfill for Telegram, Lark, and DingTalk channels"

steps:
  # ==================== Telegram Test ====================
  - op: click
    text: "设置"
  - op: click
    text: "渠道"
  - op: click
    text: "Telegram"

  # Enter Telegram bot token
  - op: type_text
    text: "123456:ABC-DEF-GHI-JKL-MNOPQRSTUVWXYZ-1234567890"
  - op: screenshot
    path: "screenshots/telegram-token-entered.png"

  # Test connection (optional - may fail with placeholder token)
  - op: click
    text: "Test"
  - op: pause
    duration: 3000
  - op: screenshot
    path: "screenshots/telegram-test-result.png"

  # Close settings by pressing Escape
  - op: press_key
    key: "Escape"
  - op: pause
    duration: 1000

  # Reopen settings and verify backfill
  - op: click
    text: "设置"
  - op: click
    text: "渠道"
  - op: click
    text: "Telegram"

  # Verify token is backfilled (should show masked placeholder)
  - op: get_attribute
    selector: "[class*='Input']"
    attribute: "value"
  - op: screenshot
    path: "screenshots/telegram-backfill-verified.png"

  # ==================== Lark Test ====================
  - op: click
    text: "Lark"

  # Enter Lark credentials
  - op: type_text
    text: "cli_1234567890"
  - op: screenshot
    path: "screenshots/lark-appid-entered.png"

  # Enter App Secret
  - op: pointer_move
    text: "App Secret"
  - op: click
  - op: type_text
    text: "secret_abcdefghijk"
  - op: screenshot
    path: "screenshots/lark-secret-entered.png"

  # Close settings
  - op: press_key
    key: "Escape"
  - op: pause
    duration: 1000

  # Reopen settings and verify backfill
  - op: click
    text: "设置"
  - op: click
    text: "渠道"
  - op: click
    text: "Lark"

  # Verify credentials are backfilled
  - op: screenshot
    path: "screenshots/lark-backfill-verified.png"

  # ==================== DingTalk Test ====================
  - op: click
    text: "DingTalk"

  # Enter DingTalk Client ID
  - op: type_text
    text: "dingclient123"
  - op: screenshot
    path: "screenshots/dingtalk-clientid-entered.png"

  # Enter Client Secret
  - op: pointer_move
    text: "Client Secret"
  - op: click
  - op: type_text
    text: "dingsecret456"
  - op: screenshot
    path: "screenshots/dingtalk-secret-entered.png"

  # Close settings
  - op: press_key
    key: "Escape"
  - op: pause
    duration: 1000

  # Reopen settings and verify backfill
  - op: click
    text: "设置"
  - op: click
    text: "渠道"
  - op: click
    text: "DingTalk"

  # Verify credentials are backfilled
  - op: screenshot
    path: "screenshots/dingtalk-backfill-verified.png"

  # Final screenshot
  - op: screenshot
    path: "screenshots/channel-credential-backfill-complete.png"
