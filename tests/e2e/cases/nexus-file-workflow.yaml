name: "nexus file workflow"
description: >
  End-to-end scenario: create a project file, read it back, edit it,
  search for it with glob, grep its content, verify with bash.
  Tests 6 tools + multi-turn context in a single realistic workflow.

steps:
  # ── Setup: select Nexus agent ──
  - op: wait_for_app_ready
    timeout: 300
  - op: mouse_click
    text: "新会话"
  - op: pause
    duration: 3000
  - op: mouse_click
    text: "Nexus"
  - op: pause
    duration: 2000

  # ── Turn 1: Create a Python file with write_file ──
  - op: type_text
    text: >
      Use the write_file tool to create /workspace/e2e_project/main.py with this exact content:
      import os
      PROJECT_NAME = "nexus-e2e-test"
      VERSION = "1.0.0"
      print(f"Running {PROJECT_NAME} v{VERSION}")
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 60
  - op: screenshot
    path: "screenshots/nexus-workflow-01-write.png"

  # ── Turn 2: Read it back with read_file ──
  - op: type_text
    text: "Now use read_file to read /workspace/e2e_project/main.py and show me the content."
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-workflow-02-read.png"
  - op: judge
    expect: "nexus-e2e-test VERSION 1.0.0"

  # ── Turn 3: Edit the version with edit_file ──
  - op: type_text
    text: 'Use edit_file to change VERSION = "1.0.0" to VERSION = "2.0.0" in /workspace/e2e_project/main.py'
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-workflow-03-edit.png"

  # ── Turn 4: Find the file with glob ──
  - op: type_text
    text: "Use the glob tool to find all *.py files under /workspace/e2e_project/"
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-workflow-04-glob.png"
  - op: judge
    expect: "main.py"

  # ── Turn 5: Search content with grep ──
  - op: type_text
    text: 'Use the grep tool to search for "PROJECT_NAME" in /workspace/e2e_project/'
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-workflow-05-grep.png"
  - op: judge
    expect: "PROJECT_NAME nexus-e2e-test"

  # ── Turn 6: Verify with bash (tests VFS path resolution) ──
  - op: type_text
    text: 'Use the bash tool to run: cat /workspace/e2e_project/main.py'
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-workflow-06-bash.png"
  - op: judge
    expect: "2.0.0"

  # ── Final: Confirm multi-turn context ──
  - op: type_text
    text: "What was the original version number before I asked you to edit it?"
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-workflow-07-context.png"
  - op: judge
    expect: "1.0.0"
