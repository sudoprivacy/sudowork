name: "nexus tool: bash"
description: "Verify Nexus agent can execute bash commands and render output"

steps:
  - op: wait_for_app_ready
    timeout: 300

  - op: mouse_click
    text: "新会话"
  - op: pause
    duration: 3000

  - op: mouse_click
    text: "Nexus"
  - op: pause
    duration: 2000

  # Ask to run a deterministic bash command
  - op: type_text
    text: "Use the bash tool to run: echo NEXUS_BASH_TEST_12345"
  - op: press_key
    key: "Enter"
    wait: 3

  - op: wait_for_response
    timeout: 30

  - op: screenshot
    path: "screenshots/nexus-03-bash.png"
  - op: judge
    expect: "NEXUS_BASH_TEST_12345"
