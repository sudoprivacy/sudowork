name: "/model command"
description: "Test /model slash command: list models, autocomplete, switch, verify"
tags: [no-api]

steps:
  # Start fresh — click "新会话"
  - op: pointer_move
    text: "新会话"
  - op: pointer_down
  - op: pointer_up
  - op: pause
    duration: 5000

  # 1. Type /model and send
  - op: key_down
    value: "/"
  - op: key_up
    value: "/"
  - op: key_down
    value: "m"
  - op: key_up
    value: "m"
  - op: key_down
    value: "o"
  - op: key_up
    value: "o"
  - op: key_down
    value: "d"
  - op: key_up
    value: "d"
  - op: key_down
    value: "e"
  - op: key_up
    value: "e"
  - op: key_down
    value: "l"
  - op: key_up
    value: "l"
  - op: key_down
    value: "Enter"
  - op: key_up
    value: "Enter"
  - op: pause
    duration: 8000

  # 2. Screenshot to verify
  - op: screenshot
    path: "screenshots/model-command-result.png"
