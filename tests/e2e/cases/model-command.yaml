name: "/model command"
description: "Test /model slash command: type /model, send, verify model list appears"
tags: [no-api]

steps:
  - op: wait_for_app_ready
    timeout: 300

  # Type /model and send
  - op: type_text
    text: "/model"
  - op: press_key
    key: "Enter"
    wait: 5

  # Verify model list appeared in page
  - op: screenshot
    path: "screenshots/model-command-result.png"
  - op: judge
    expect: "claude sonnet model"
