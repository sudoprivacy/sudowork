name: "nexus multi-turn conversation"
description: "Verify Nexus agent handles multi-turn context correctly"

steps:
  - op: wait_for_app_ready
    timeout: 300

  - op: mouse_click
    text: "新会话"
  - op: pause
    duration: 3000

  - op: mouse_click
    text: "Nexus"
  - op: pause
    duration: 2000

  # Turn 1: Set a fact
  - op: type_text
    text: "Remember this number: 42857. Just confirm you got it."
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-07-turn1.png"

  # Turn 2: Recall the fact
  - op: type_text
    text: "What was the number I told you to remember?"
  - op: press_key
    key: "Enter"
    wait: 3
  - op: wait_for_response
    timeout: 30
  - op: screenshot
    path: "screenshots/nexus-08-turn2.png"
  - op: judge
    expect: "42857"
