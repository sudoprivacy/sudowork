name: Prepare verified native image dependencies
description: Verify the locked sharp libvips archive before any install script runs.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/npm-cache/_libvips
        key: libvips-8.14.5-${{ runner.os }}-${{ runner.arch }}-integrity-v2
    - name: Verify the original dependency archive
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        npm_config_cache: ${{ runner.temp }}/npm-cache
      run: |
        node .github/scripts/cache-sharp-libvips.mjs
        node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "npm_config_cache=" + process.env.npm_config_cache + "\n")'
