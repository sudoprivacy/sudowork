name: Update ai-dev-browser

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "ai-dev-browser release tag (e.g. v0.3.0)"
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule to tag
        run: |
          cd vendor/ai-dev-browser
          git fetch origin --tags
          git checkout ${{ inputs.tag }}
          cd ../..
          git add vendor/ai-dev-browser

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/update-ai-dev-browser
          title: "chore(deps): update ai-dev-browser to ${{ inputs.tag }}"
          body: |
            Update ai-dev-browser submodule to **${{ inputs.tag }}**.

            Triggered manually via workflow_dispatch.
            Review the [release notes](https://github.com/sudoprivacy/ai-dev-browser/releases/tag/${{ inputs.tag }}) before merging.
          base: dev
          commit-message: "chore(deps): update ai-dev-browser to ${{ inputs.tag }}"
          delete-branch: true
