name: Nightly Build Release

permissions:
  contents: write
  actions: write

on:
  schedule:
    # 北京时间 00:00 = UTC 16:00 (前一天)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'dev'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux
          - all
        default: 'all'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # 第一步：准备构建矩阵并创建 nightly tag
  # 先基于 dev 分支打 tag，确保后续所有 job 使用同一个 commit
  prepare:
    name: Prepare Build & Create Tag
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      branch: ${{ steps.context.outputs.branch }}
      skip_code_quality: ${{ steps.context.outputs.skip_code_quality }}
      tag_name: ${{ steps.create-tag.outputs.tag_name }}
      short_sha: ${{ steps.create-tag.outputs.short_sha }}
      date_utc: ${{ steps.create-tag.outputs.date_utc }}
      release_name: ${{ steps.create-tag.outputs.release_name }}

    steps:
      - name: Resolve build context
        id: context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ inputs.branch }}"
            SKIP_CODE_QUALITY="${{ inputs.skip_code_quality }}"
          else
            BRANCH="dev"
            SKIP_CODE_QUALITY="true"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "skip_code_quality=$SKIP_CODE_QUALITY" >> "$GITHUB_OUTPUT"
          echo "Nightly build branch: $BRANCH"
          echo "Skip code quality: $SKIP_CODE_QUALITY"

      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORM="${{ inputs.platform }}"
          else
            PLATFORM="all"
          fi

          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}'
          MACOS_X64='{"platform":"macos-x64","os":"macos-15-intel","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}'
          WINDOWS_ARM64='{"platform":"windows-arm64","os":"windows-2022","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"}'
          LINUX='{"platform":"linux","os":"ubuntu-latest","command":"node scripts/build-with-builder.js auto --linux","artifact-name":"linux-build","arch":"x64-arm64"}'

          if [ "$PLATFORM" = "all" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64,$MACOS_X64,$WINDOWS_X64]}"
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64]}"
          elif [ "$PLATFORM" = "macos-x64" ]; then
            MATRIX="{\"include\":[$MACOS_X64]}"
          elif [ "$PLATFORM" = "windows-x64" ]; then
            MATRIX="{\"include\":[$WINDOWS_X64]}"
          elif [ "$PLATFORM" = "windows-arm64" ]; then
            MATRIX="{\"include\":[$WINDOWS_ARM64]}"
          elif [ "$PLATFORM" = "linux" ]; then
            MATRIX="{\"include\":[$LINUX]}"
          else
            echo "Unsupported platform: $PLATFORM"
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Generated matrix for platform '$PLATFORM':"
          echo "$MATRIX" | python3 -m json.tool

      # Checkout 目标分支以获取精确的 commit SHA 并创建 tag
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.context.outputs.branch }}

      # 创建 nightly tag，后续所有 job 都基于此 tag 构建
      # 这样即使 dev 分支有新 commit 推入，也不会影响正在进行的构建
      - name: Create nightly tag
        id: create-tag
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          DATE_UTC=$(date -u +%Y-%m-%d)
          TAG_NAME="nightly-${DATE_UTC}-${SHORT_SHA}"
          RELEASE_NAME="Nightly Build ${DATE_UTC} (${SHORT_SHA})"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "date_utc=$DATE_UTC" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          # 检查 tag 是否已存在（同一天同一 commit 重复构建的情况）
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
            echo "Tag $TAG_NAME already exists, skipping creation"
          else
            git tag "$TAG_NAME" "$FULL_SHA"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag: $TAG_NAME at commit $FULL_SHA"
          fi

          echo "=========================================="
          echo "NIGHTLY TAG INFO"
          echo "=========================================="
          echo "Branch: ${{ steps.context.outputs.branch }}"
          echo "Commit: $FULL_SHA ($SHORT_SHA)"
          echo "Tag: $TAG_NAME"
          echo "Release: $RELEASE_NAME"
          echo "=========================================="

  # 第二步：基于固定的 tag 执行构建
  build-pipeline:
    name: Build Pipeline
    needs: prepare
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      ref: ${{ needs.prepare.outputs.tag_name }}
      skip_code_quality: ${{ fromJSON(needs.prepare.outputs.skip_code_quality) }}
      append_commit_hash: true
    secrets: inherit

  # 第三步：发布 nightly release（tag 已在 prepare 阶段创建）
  release:
    name: Publish Nightly Release
    runs-on: ubuntu-latest
    needs: [prepare, build-pipeline]
    if: needs.build-pipeline.result == 'success'
    outputs:
      tag_name: ${{ needs.prepare.outputs.tag_name }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: nightly-artifacts

      - name: Prepare nightly assets
        shell: bash
        run: |
          rm -rf nightly-release-assets
          mkdir -p nightly-release-assets

          find nightly-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.dmg" -o \
            -name "*.AppImage" -o \
            -name "*.zip" \
          \) -print0 | while IFS= read -r -d '' file; do
            base_name=$(basename "$file")
            extension=".${base_name##*.}"
            file_stem="${base_name%$extension}"
            nightly_name="${file_stem}-nightly-${{ needs.prepare.outputs.date_utc }}-${{ needs.prepare.outputs.short_sha }}${extension}"

            cp -f "$file" "nightly-release-assets/$nightly_name"
          done

          echo "Nightly assets:"
          ls -lh nightly-release-assets

      - name: Create nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          prerelease: true
          draft: false
          make_latest: false
          generate_release_notes: false
          files: |
            nightly-release-assets/**/*.exe
            nightly-release-assets/**/*.msi
            nightly-release-assets/**/*.dmg
            nightly-release-assets/**/*.AppImage
            nightly-release-assets/**/*.zip
          body: |
            Automated nightly build from `${{ needs.prepare.outputs.branch }}`.

            - Date (UTC): `${{ needs.prepare.outputs.date_utc }}`
            - Commit: `${{ needs.prepare.outputs.short_sha }}`
            - Tag: `${{ needs.prepare.outputs.tag_name }}`
            - Trigger: `${{ github.event_name }}`

            This nightly release is for preview/testing downloads only.
            It intentionally excludes auto-update metadata (`*.yml`, `*.blockmap`) so it does not affect the stable update channel.
          token: ${{ secrets.GH_TOKEN }}

      - name: Cleanup old nightly releases
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          KEEP=14
          TO_DELETE=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease == true and (.tagName | startswith("nightly-"))) | .tagName' \
            | tail -n +$((KEEP + 1)))

          if [ -z "$TO_DELETE" ]; then
            echo "No old nightly releases to clean up."
            exit 0
          fi

          echo "Deleting old nightly releases:"
          echo "$TO_DELETE"
          echo "$TO_DELETE" | xargs -I{} gh release delete {} --repo "${{ github.repository }}" --yes --cleanup-tag

  # 【通知】通知 QA 团队下载测试
  notify-qa:
    name: Notify QA Team
    needs: [prepare, build-pipeline, release]
    if: success()
    runs-on: ubuntu-latest
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_QA_WEBHOOK_URL }}
    steps:
      - name: Send Feishu Notification
        if: env.FEISHU_WEBHOOK_URL != ''
        run: |
          TAG_NAME="${{ needs.release.outputs.tag_name }}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RELEASE_URL="${REPO_URL}/releases/tag/${TAG_NAME}"
          MIRROR_URL="https://sudowork.sudoprivacy.com/github-releases.html?tag=${TAG_NAME}"
          DATE=$(date -u +%Y-%m-%d)

          echo "=========================================="
          echo "📢 Nightly Build Notification"
          echo "=========================================="
          echo "Tag: $TAG_NAME"
          echo "Mirror URL: $MIRROR_URL"
          echo "Release URL: $RELEASE_URL"

          # 检查是否配置了飞书 Webhook
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "⚠️ FEISHU_QA_WEBHOOK_URL not configured, skipping notification"
            echo "To enable: Add FEISHU_QA_WEBHOOK_URL secret in repository settings"
            exit 0
          fi

          # 构建消息内容
          MESSAGE=$(cat <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "header": {
                "title": {
                  "tag": "plain_text",
                  "content": "🌙 Nightly Build Ready"
                },
                "template": "blue"
              },
              "elements": [
                {
                  "tag": "div",
                  "fields": [
                    {
                      "is_short": true,
                      "text": {
                        "tag": "lark_md",
                        "content": "**Tag:**\n${TAG_NAME}"
                      }
                    },
                    {
                      "is_short": true,
                      "text": {
                        "tag": "lark_md",
                        "content": "**Date:**\n${DATE}"
                      }
                    }
                  ]
                },
                {
                  "tag": "note",
                  "elements": [
                    {
                      "tag": "lark_md",
                      "content": "🚀 **推荐使用「国内加速下载」**，国内镜像加速，速度更快。原 GitHub 下载保留作为备用渠道。"
                    }
                  ]
                },
                {
                  "tag": "action",
                  "actions": [
                    {
                      "tag": "button",
                      "text": {
                        "tag": "lark_md",
                        "content": "🚀 **国内加速下载（推荐）**"
                      },
                      "url": "${MIRROR_URL}",
                      "type": "primary"
                    },
                    {
                      "tag": "button",
                      "text": {
                        "tag": "plain_text",
                        "content": "GitHub 原始下载（备用）"
                      },
                      "url": "${RELEASE_URL}",
                      "type": "default"
                    }
                  ]
                }
              ]
            }
          }
          EOF
          )

          # 发送请求
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$FEISHU_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$MESSAGE")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Feishu notification sent successfully"
            echo "Response: $BODY"
          else
            echo "⚠️ Failed to send Feishu notification"
            echo "HTTP Code: $HTTP_CODE"
            echo "Response: $BODY"
          fi

      - name: Notification Summary
        run: |
          TAG_NAME="${{ needs.release.outputs.tag_name }}"
          echo "=========================================="
          echo "📢 Nightly Build Notification"
          echo "=========================================="
          echo "Tag: $TAG_NAME"
          echo "Mirror (推荐): https://sudowork.sudoprivacy.com/github-releases.html?tag=${TAG_NAME}"
          echo "GitHub (备用): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
          echo "Date: $(date -u +%Y-%m-%d)"
          echo "=========================================="
          echo ""
          echo "✅ Nightly build is ready for QA testing"