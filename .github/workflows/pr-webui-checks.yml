# PR gate for apps/webui: typecheck / lint / format:check / unit / contract / integration tests.
# Mirrors pr-checks.yml conventions (code-event triggers, concurrency, minimal deps).
#
# Integration runs here because leaving it out is what let it rot: two assertions
# in conversations.test.ts sat red on dev for days after fields were added to the
# context and agent DTOs, and nothing reported it. A suite nothing runs protects
# nothing. It needs a real PostgreSQL (the tests create and migrate their own
# database), which is what the postgres service below provides.
# build:packages is a DUAL prerequisite: tsc resolves the shared packages through
# their `types` exports condition (dist/*.d.ts) AND vitest resolves them at runtime
# through the `default` condition (dist/*.js) — without it the tests cannot even
# import the packages.

name: "✓PR WebUI Checks"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, dev]

concurrency:
  group: pr-webui-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_INSTALL_REGISTRY: "https://registry.npmjs.org/"

jobs:
  webui-container:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: WebUI Container E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/webui/Dockerfile
          load: true
          tags: sudowork-webui:container-e2e
          cache-from: type=gha,scope=webui-container-e2e
          cache-to: type=gha,mode=max,scope=webui-container-e2e
      - name: Boot the packaged server and production SPA
        run: python3 apps/webui/tests/e2e/container_smoke.py --image sudowork-webui:container-e2e
  webui-checks:
    name: WebUI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same major as production (the deployed stack runs postgres:16-alpine), so a
    # migration that passes here is a migration that passes there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Build shared packages
        run: bun run build:packages

      - name: Type check
        working-directory: apps/webui
        run: bun run typecheck

      - name: Lint
        working-directory: apps/webui
        run: bun run lint

      - name: Check Prettier formatting
        working-directory: apps/webui
        run: bun run format:check

      - name: Unit tests
        working-directory: apps/webui
        run: bun run test:unit

      - name: Contract tests
        working-directory: apps/webui
        run: bun run test:contract

      # DATABASE_URL is set explicitly rather than relying on the helper's default:
      # the CI database is a fact of this workflow, not something to infer from a
      # fallback in test code.
      - name: Integration tests
        working-directory: apps/webui
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bun run test:integration

      - name: Build the production SPA for Vault browser acceptance
        working-directory: apps/webui
        run: bun run build

      - name: Install the browser for Vault acceptance
        uses: browser-actions/setup-chrome@v2
        id: vault-chrome
        with:
          chrome-version: stable

      - name: Verify Vault save and full reload through the real WebUI server
        working-directory: apps/webui
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          E2E_NO_SERVER: "1"
          E2E_CHROME_PATH: ${{ steps.vault-chrome.outputs.chrome-path }}
        run: bunx playwright test tests/e2e/vault-roundtrip.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vault-browser-acceptance
          path: apps/webui/test-results
