name: "✓PR Integration Smoke"

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: pr-integration-smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_INSTALL_REGISTRY: "https://registry.npmjs.org/"
  # Cold macOS installs can exhaust sockets while resolving the monorepo.
  BUN_CONFIG_MAX_HTTP_REQUESTS: "32"

jobs:
  browser-backend-live:
    name: Browser Backend Live (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Read pinned Rust browser reference
        id: reference
        shell: bash
        run: |
          node -e "const r=require('./apps/desktop/tests/integration/fixtures/sudohand-reference.json'); console.log('repository='+r.repository); console.log('commit='+r.commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.reference.outputs.repository }}
          ref: ${{ steps.reference.outputs.commit }}
          path: .tmp/sudohand
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .tmp/sudohand
      - name: Build pinned browser
        working-directory: .tmp/sudohand
        run: cargo build --locked -p sudohand-cli
      - name: Install test dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          python -m pip install websockets websocket-client Pillow deprecated psutil
      - name: Run real wrappers, Chrome and application result receiver
        working-directory: apps/desktop
        shell: bash
        run: |
          export BROWSER_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export SUDOWORK_SUDOHAND_PATH="$(python -c 'import pathlib,sys; print((pathlib.Path("../../.tmp/sudohand/target/debug") / ("suh.exe" if sys.platform == "win32" else "suh")).resolve())')"
          bun run test:browser-live
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-backend-${{ matrix.os }}
          path: .tmp/browser-migration

  browser-port-isolation:
    name: Browser Port Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb xauth
          fi
          pip install "${{ github.workspace }}/vendor/ai-dev-browser"

      - name: Run browser port isolation test
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' python3 tests/integration/browser_port_isolation.py
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/ai-dev-browser

  browser-panel-mcp-server:
    name: Browser-Panel MCP Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Build browser-panel MCP server
        run: bun run browser-mcp:build

      - name: Run MCP server protocol test
        run: python3 tests/integration/browser_panel_mcp_server.py

  authproxy-secrets-http-e2e:
    # End-to-end of the SKILL → AuthProxyServer HTTP → handler path
    # (the bug surface user 进二 hit on v0.2.7). Boots a real
    # AuthProxyServer in-process and drives real fetch() calls against
    # it with real token auth. Cluster + vault dylib are mocked here
    # (covered by Vault Secrets gRPC E2E above); this job specifically
    # locks in the HTTP transport + token auth + handler routing layers
    # those gRPC tests don't reach.
    name: AuthProxy /secrets HTTP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Run authProxy /secrets HTTP e2e
        run: bunx vitest run tests/integration/authProxySecretsHttp.integration.test.ts

  vault-signed-download:
    name: Runtime Release E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        env:
          # This job drives the real native runtime with Node; Electron is mocked.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install --frozen-lockfile

      - name: Install the checksum-verified macOS FUSE dependency
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src/shared/runtime-versions.json')['fuse-t']")
          PACKAGE="fuse-t-macos-installer-${VERSION}.pkg"
          DOWNLOAD="${RUNNER_TEMP}/${PACKAGE}"
          curl -fsSL --retry 3 --retry-max-time 180 --connect-timeout 15 --max-time 120 "https://github.com/macos-fuse-t/fuse-t/releases/download/${VERSION}/${PACKAGE}" -o "$DOWNLOAD"
          echo "6a29c747e61a86a405a189efc3de42812d73147135f93a1bb0624c1e7b90e654  $DOWNLOAD" | shasum -a 256 -c -
          sudo installer -pkg "$DOWNLOAD" -target /

      - name: Download checksum verified Sudocode
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dev/download-acp-test-runtime.mjs

      - name: Install, restart, and update the published runtime
        env:
          SUDOWORK_RUNTIME_E2E: "1"
          SUDOWORK_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/sudowork-runtime-evidence
        run: bunx vitest run tests/integration/vault-signed-download.integration.test.ts tests/integration/acpTunnelTransport.integration.test.ts

      - name: Preserve native runtime startup evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-startup-${{ matrix.os }}
          path: ${{ runner.temp }}/sudowork-runtime-evidence
          if-no-files-found: warn
          retention-days: 7

  scode-config-isolation:
    # Real cross-repo contract: sudowork isolates its engine-scode by spawning
    # the scode binary with SUDO_CODE_CONFIG_HOME → ~/.nexus/sudowork/sudocode.
    # This job downloads + extracts the ACTUAL scode binary and drives
    # `scode config --output-format json` to prove the user-scope config home
    # follows the env var and never leaks to the standalone ~/.nexus/sudocode.
    # Runs on Windows because scode ships macOS + Windows only (no Linux release),
    # and Windows is sudowork's primary target. See
    # tests/integration/scodeConfigHomeIsolation.integration.test.ts.
    name: Scode Config-Home Isolation
    runs-on: windows-latest
    timeout-minutes: 10
    # This gate drives scode and node-pty under Node, without an Electron UI.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      SUDOWORK_REQUIRE_SCODE_ISOLATION: "1"
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        # This Node-only gate uses @lydell/node-pty's platform prebuild. Avoid
        # unrelated workspace/native install scripts consuming its test budget;
        # the test still requires the real addon and downloaded scode binary.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download scode binary (windows archive)
        run: bun run scode:download

      - name: Extract scode binary and export SCODE_BIN
        shell: pwsh
        run: |
          $zip = Get-ChildItem resources -Filter '*scode-windows*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no scode windows archive downloaded (empty release?)' }
          if ($zip.Length -eq 0) { throw "scode archive is an empty placeholder ($($zip.Name)) — no binary published for this version" }
          $dest = Join-Path $env:RUNNER_TEMP 'scode-extracted'
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          $exe = Get-ChildItem $dest -Recurse -Filter 'scode.exe' | Select-Object -First 1
          if (-not $exe) { throw 'scode.exe not found in archive' }
          "SCODE_BIN=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SCODE_BIN=$($exe.FullName)"

      - name: Run scode config-home isolation integration test
        run: bunx vitest run tests/integration/scodeConfigHomeIsolation.integration.test.ts
