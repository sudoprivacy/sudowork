name: '✓PR Integration Smoke'

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: pr-integration-smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-port-isolation:
    name: Browser Port Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install websockets websocket-client Pillow deprecated

      - name: Run browser port isolation test
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 2
          python3 tests/integration/browser_port_isolation.py
        env:
          DISPLAY: ':99'
          PYTHONPATH: ${{ github.workspace }}/vendor/ai-dev-browser

  vault-signed-download:
    name: Vault Signed Download
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Run vault signed-download integration test
        # Real 2-step user journey: download cluster + vault dylib + .sig
        # → boot the just-downloaded cluster against the just-downloaded
        # plugin-dir → assert log contains "plugin signature verified"
        # and the post-verify service registration. Full plan + design
        # notes (incl. why we deliberately do NOT cargo-install from
        # nexus-vfs main) in tests/integration/vault-signed-download.integration.test.ts.
        run: bunx vitest run tests/integration/vault-signed-download.integration.test.ts
