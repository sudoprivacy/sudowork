name: '✓PR E2E Smoke (no API key)'

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: pr-e2e-smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  e2e-smoke:
    name: E2E Smoke Tests (no API key)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev xvfb
          pip install websockets websocket-client Pillow deprecated pyyaml
          # Electron SUID sandbox for CI
          sudo chown root:root node_modules/electron/dist/chrome-sandbox 2>/dev/null || true
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox 2>/dev/null || true

      - name: Start Xvfb and Sudowork
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 2
          bun run start &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9232/json/version > /dev/null 2>&1 && echo "CDP ready (${i}×2s)" && break
            sleep 2
          done
          curl -sf http://127.0.0.1:9232/json/version || { echo "::error::Sudowork CDP not responding"; exit 1; }
        env:
          CI: true
          DISPLAY: ':99'
          NEXUS_CDP_PORT: '9232'

      - name: Run smoke tests (no-api tag only)
        run: |
          cd tests/e2e
          python3 runner.py --port 9232 --tag no-api
        env:
          DISPLAY: ':99'
          PYTHONPATH: ${{ github.workspace }}/vendor/ai-dev-browser:${{ github.workspace }}/skills/_builtin/browser

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-smoke-screenshots
          path: tests/e2e/screenshots/
          retention-days: 7
          if-no-files-found: ignore
