name: ACP tunnel E2E

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the real API workflow (requires ACP_LIVE_CONFIG_JSON secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: acp-tunnel-e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  published-pair:
    name: Published ACP pair (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download and verify the pinned release pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dev/download-acp-test-runtime.mjs
      - name: Stage live credentials only for an explicit live run
        if: github.event_name == 'workflow_dispatch' && inputs.live
        env:
          ACP_LIVE_CONFIG_JSON: ${{ secrets.ACP_LIVE_CONFIG_JSON }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const config = process.env.ACP_LIVE_CONFIG_JSON;
          if (!config) throw new Error('Live run requested but ACP_LIVE_CONFIG_JSON is missing');
          JSON.parse(config);
          const file = path.join(process.env.RUNNER_TEMP, 'acp-live-config.json');
          fs.writeFileSync(file, config, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `SUDOWORK_ACP_LIVE_CONFIG=${file}\nSUDOWORK_ACP_TUNNEL_LIVE=1\n`);
          NODE
      - name: Exercise production transport and published scode
        env:
          SUDOWORK_ACP_TUNNEL_E2E: "1"
        run: bunx vitest run tests/integration/acpTunnelLive.integration.test.ts --reporter=verbose
      - name: Remove live credentials
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          fs.rmSync(path.join(process.env.RUNNER_TEMP, 'acp-live-config.json'), { force: true });
          NODE
