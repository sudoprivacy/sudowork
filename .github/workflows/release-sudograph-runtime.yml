name: Release Sudograph host runtime

on:
  push:
    tags: ['sudograph-runtime-v*']

permissions:
  contents: read

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: sudoprivacy/sudograph
          ref: 635f222b8430b9a0ace4c17169fa8c582f61deea
          path: .host-runtime-acceptance/compiler
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Require an accepted source and matching package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev
          node -e 'const p=require("./packages/sudograph-runtime/package.json"); if(process.env.RELEASE_TAG!=="sudograph-runtime-v"+p.version)throw Error("Tag differs from package version")'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:packages
      - run: python -m pip --isolated install --index-url https://pypi.org/simple .host-runtime-acceptance/compiler
      - name: Pack and accept the exact installable artifact
        env:
          SUDOGRAPH_COMPILER_ROOT: ${{ runner.temp }}/sudograph-worker
        run: |
          set -euo pipefail
          mkdir "$SUDOGRAPH_COMPILER_ROOT"
          export SUDOGRAPH_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export BUN_EXECUTABLE="$(bun -e 'console.log(process.execPath)')"
          bun build ./apps/desktop/tests/integration/sudographModelRuntime.live.ts --target=node --format=esm --outfile=./sudograph-model-runtime-live.mjs
          node scripts/accept-sudograph-host-package.mjs --directory "$RUNNER_TEMP/sudograph-host-package" --probe ./sudograph-model-runtime-live.mjs
      - name: Publish the accepted archive and integrity receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/sudograph-host-package/* --verify-tag --generate-notes
