name: Candidate Promotion

on:
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: 'Nightly tag to promote (e.g. nightly-2026-04-01-abc1234)'
        required: true
        type: string
      target_version:
        description: 'Target release version (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # 步骤1: 从 Nightly 标签构建验证（回归测试）
  regression-test:
    name: Regression Test
    uses: ./.github/workflows/_build-reusable.yml
    with:
      ref: ${{ inputs.nightly_tag }}
      skip_code_quality: false
    secrets: inherit

  # 步骤2: 人工审计闸口（需要在 GitHub Settings -> Environments 配置审批人）
  manual-approval:
    name: Manual Audit
    needs: regression-test
    runs-on: ubuntu-latest
    environment: 'candidate-approval'
    steps:
      - name: Audit Checkpoint
        run: |
          echo "=========================================="
          echo "✅ Manual Audit Approved"
          echo "=========================================="
          echo "Nightly Tag: ${{ inputs.nightly_tag }}"
          echo "Target Version: v${{ inputs.target_version }}"
          echo "Auditor: awaiting approval in GitHub Environment"

  # 步骤3: 人工审计通过后，打 RC 标签
  create-rc-tag:
    name: Create RC Tag
    needs: manual-approval
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.rc.outputs.rc_tag }}

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Create Candidate RC Tag
        id: rc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 创建 RC 标签，标识进入 Candidate 阶段
          RC_TAG="v${{ inputs.target_version }}-rc"
          NIGHTLY_TAG="${{ inputs.nightly_tag }}"

          echo "=========================================="
          echo "Creating Candidate RC Tag"
          echo "=========================================="
          echo "Nightly Tag: $NIGHTLY_TAG"
          echo "RC Tag: $RC_TAG"

          # 创建并推送 RC 标签
          git tag $RC_TAG
          git push origin $RC_TAG

          echo "rc_tag=$RC_TAG" >> $GITHUB_OUTPUT
          echo "✅ RC tag created: $RC_TAG"

  # 步骤4: 合并 dev 到 main 分支
  promote-to-main:
    name: Promote to Main
    needs: create-rc-tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev to main
        run: |
          RC_TAG="${{ needs.create-rc-tag.outputs.rc_tag }}"

          echo "=========================================="
          echo "Promoting Candidate to Main"
          echo "=========================================="
          echo "RC Tag: $RC_TAG"

          # 切换到 main 分支
          git checkout main

          # 合并 dev 分支（包含 RC 标签的提交）
          git merge dev --no-ff -m "chore: promote candidate $RC_TAG to release"

          # 推送到 main
          git push origin main

          echo "✅ Dev merged to main successfully"

      - name: Create Official Release Tag
        id: release
        run: |
          TARGET_VERSION="${{ inputs.target_version }}"
          RELEASE_TAG="v${TARGET_VERSION}"

          echo "=========================================="
          echo "Creating Official Release Tag"
          echo "=========================================="
          echo "Target Tag: $RELEASE_TAG"

          # 检查 tag 是否已存在
          if git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_TAG}$"; then
            echo "⚠️ Tag $RELEASE_TAG already exists, auto-incrementing version..."

            # 解析当前版本号
            CURRENT_VERSION=$(node -p "require('./package.json').version")

            if [[ $CURRENT_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR=${BASH_REMATCH[1]}
              MINOR=${BASH_REMATCH[2]}
              PATCH=${BASH_REMATCH[3]}
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

              echo "📝 Updating package.json version from $CURRENT_VERSION to $NEW_VERSION"

              # 更新 package.json 版本号
              bun pm version $NEW_VERSION

              # 提交版本更新
              git add package.json bun.lock
              git commit -m "chore: bump version to $NEW_VERSION"
              git push origin main

              # 更新 tag 名称
              RELEASE_TAG="v${NEW_VERSION}"
              echo "🚀 New release tag: $RELEASE_TAG"
            else
              echo "❌ Cannot parse version: $CURRENT_VERSION"
              exit 1
            fi
          fi

          # 创建并推送正式发布 tag
          git tag $RELEASE_TAG
          git push origin $RELEASE_TAG

          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Official release tag created: $RELEASE_TAG"
          echo "Next: Official release workflow will trigger automatically"

      - name: Summary
        run: |
          echo "=========================================="
          echo "✅ Candidate Promotion Complete"
          echo "=========================================="
          echo "Nightly Tag: ${{ inputs.nightly_tag }}"
          echo "RC Tag: ${{ needs.create-rc-tag.outputs.rc_tag }}"
          echo "Release Tag: ${{ steps.release.outputs.release_tag }}"
          echo ""
          echo "Flow: Nightly → RC → Merge to Main → Official Release"
