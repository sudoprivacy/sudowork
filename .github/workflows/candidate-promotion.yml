name: Candidate Promotion

on:
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: 'Nightly tag to promote (e.g. nightly-2026-04-01-abc1234)'
        required: true
        type: string
      target_version:
        description: 'Target release version (must match the candidate manifests)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: candidate-promotion
  cancel-in-progress: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  validate-candidate:
    name: Validate Candidate Source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.nightly_tag }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate version and main ancestry
        id: candidate
        env:
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          COMMIT=$(bash apps/desktop/scripts/promote-candidate.sh validate "$NIGHTLY_TAG" "$TARGET_VERSION")
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  regression-test:
    name: Regression Test
    needs: validate-candidate
    uses: ./.github/workflows/_build-reusable.yml
    with:
      ref: ${{ needs.validate-candidate.outputs.commit }}
      skip_code_quality: false
      matrix: >-
        {"include":[{"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},{"platform":"macos-x64","os":"macos-15-intel","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"},{"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}]}
    secrets: inherit

  manual-approval:
    name: Manual Audit
    needs: regression-test
    runs-on: ubuntu-latest
    environment: 'candidate-approval'
    steps:
      - name: Audit checkpoint
        run: echo 'Candidate source and supported platform builds passed the audit gate.'

  create-rc-tag:
    name: Create RC Tag
    needs: [validate-candidate, manual-approval]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-candidate.outputs.commit }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Tag the audited candidate
        env:
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
          TARGET_VERSION: ${{ inputs.target_version }}
          CANDIDATE_COMMIT: ${{ needs.validate-candidate.outputs.commit }}
        run: bash apps/desktop/scripts/promote-candidate.sh rc "$NIGHTLY_TAG" "$TARGET_VERSION" "$CANDIDATE_COMMIT"

  promote-to-main:
    name: Promote to Main
    needs: [validate-candidate, create-rc-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-candidate.outputs.commit }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Publish the exact audited source
        env:
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
          TARGET_VERSION: ${{ inputs.target_version }}
          CANDIDATE_COMMIT: ${{ needs.validate-candidate.outputs.commit }}
        run: bash apps/desktop/scripts/promote-candidate.sh promote "$NIGHTLY_TAG" "$TARGET_VERSION" "$CANDIDATE_COMMIT"
