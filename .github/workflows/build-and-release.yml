name: Build and Release

permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: write

on:
  # 【变更】开发阶段构建改为手动触发，不再每次 push dev 自动触发
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        type: choice
        options:
          - dev
          - main
        default: 'dev'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds)'
        required: false
        type: boolean
        default: false
  # 正式发布：推送 v* 标签时自动触发
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'  # 匹配 v1.2.0, v1.2.0-rc, v1.2.0.1 等

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # Prepare build matrix based on trigger type
  # Tag release: only mac-arm64 and windows-x64 (required platforms)
  # Dev branch (manual): all platforms
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build_branch: ${{ steps.context.outputs.build_branch }}
      is_manual_dev: ${{ steps.context.outputs.is_manual_dev }}

    steps:
      - name: Resolve build context
        id: context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_BRANCH="${{ inputs.branch }}"
            IS_MANUAL_DEV="true"
          else
            BUILD_BRANCH="main"
            IS_MANUAL_DEV="false"
          fi

          echo "build_branch=$BUILD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "is_manual_dev=$IS_MANUAL_DEV" >> "$GITHUB_OUTPUT"
          echo "Build branch: $BUILD_BRANCH"
          echo "Is manual dev build: $IS_MANUAL_DEV"

      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}'
          MACOS_X64='{"platform":"macos-x64","os":"macos-15-intel","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}'
          WINDOWS_ARM64='{"platform":"windows-arm64","os":"windows-2022","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"}'

          # Tag release: only required platforms (mac-arm64, windows-x64)
          # Manual dev build: all platforms
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "🎯 Tag release - building required platforms only (mac-arm64, windows-x64)"
            MATRIX="{\"include\":[$MACOS_ARM64,$WINDOWS_X64]}"
          else
            echo "🔧 Manual dev build - building all platforms"
            MATRIX="{\"include\":[$MACOS_ARM64,$MACOS_X64,$WINDOWS_X64,$WINDOWS_ARM64]}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix:"
          echo "$MATRIX" | python3 -m json.tool

  build-pipeline:
    name: Build Pipeline
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    # 手动触发构建 dev，或正式 tag 触发
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      ref: ${{ needs.prepare-matrix.outputs.build_branch }}
      skip_code_quality: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_code_quality || startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit


  # 自动重试 workflow（当构建失败时）
  auto-retry-workflow:
    name: Auto Retry on Build Failure
    runs-on: ubuntu-latest
    needs: build-pipeline
    # 关键：只在首次失败时触发，避免无限循环
    if: |
      failure() &&
      github.run_attempt == 1 &&
      github.event_name == 'push'

    steps:
      - name: Log retry information
        run: |
          echo "=========================================="
          echo "🔄 Auto retry triggered (first failure)"
          echo "=========================================="
          echo "Build failed on first attempt, preparing auto retry..."
          echo "Current attempt: ${{ github.run_attempt }}"
          echo "Wait strategy: 5 minutes cooldown before retry"
          echo "=========================================="

      - name: Wait before retry (5 min cooldown)
        run: |
          echo "⏳ Waiting 5 minutes before retry..."
          echo "Start: $(date)"
          sleep 300
          echo "End: $(date)"
          echo "Triggering retry..."

      - name: Trigger workflow rerun
        run: |
          echo "🔄 Triggering full workflow rerun (attempt 2)..."

          # Use re-run API (not rerun-failed-jobs, to avoid loops)
          response=$(curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -w "\n%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/rerun)

          http_code=$(echo "$response" | tail -n1)

          if [ "$http_code" = "201" ]; then
            echo ""
            echo "✅ Retry triggered successfully"
            echo "This will be attempt 2"
            echo "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo ""
            echo "❌ Retry trigger failed, HTTP status: $http_code"
            echo "Response:"
            echo "$response" | head -n-1
            exit 1
          fi

  # 自动创建 tag（仅手动触发 dev 构建时）
  create-tag:
    name: Create Dev Tag
    runs-on: ubuntu-latest
    needs: [ prepare-matrix, build-pipeline ]
    # 【变更】仅手动触发构建 dev 分支时才创建 dev-* 标签
    if: success() && needs.prepare-matrix.outputs.is_manual_dev == 'true'
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
      is_dev: ${{ steps.create_tag.outputs.is_dev }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-matrix.outputs.build_branch }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Create and push dev tag
        id: create_tag
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)

          # 【变更】开发阶段 tag 不包含版本号，格式: dev-{commit}
          TAG_NAME="dev-${COMMIT_SHORT}"
          IS_DEV="true"

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT
          echo "🔧 Development release: $TAG_NAME"

          # 检查远程 tag 是否已存在（不应该发生，因为每次 commit 不同）
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
            echo "⚠️ Dev tag $TAG_NAME already exists, this shouldn't happen"
            exit 1
          fi

          # 配置 git 用户信息
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 创建并推送 tag
          echo "Creating tag: $TAG_NAME"
          git tag $TAG_NAME
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin $TAG_NAME
          echo "✅ Successfully created and pushed tag: $TAG_NAME"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # 发布到 GitHub Releases
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ prepare-matrix, build-pipeline, create-tag ]
    # 【变更】手动触发 dev 构建后 create-tag 成功，或正式 tag 推送时触发
    if: |
      always() &&
      needs.build-pipeline.result == 'success' &&
      (needs.create-tag.result == 'success' || startsWith(github.ref, 'refs/tags/'))
    # dev 版使用 dev-release 环境，正式 tag 使用 release 环境
    environment: ${{ needs.create-tag.outputs.is_dev == 'true' && 'dev-release' || 'release' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-matrix.outputs.build_branch || github.ref }}

      - name: Get version for release
        id: version
        run: |
          # 判断触发来源：正式 tag 推送 or 手动 dev 构建
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tag 推送触发
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_DEV="false"

            # 【新增】检测是否是 RC 标签（包含 -rc, -beta, -alpha 等后缀）
            if [[ "$TAG_NAME" =~ -(rc|beta|alpha|dev|nightly) ]]; then
              IS_RC="true"
              echo "🔶 Creating pre-release from tag: $TAG_NAME"
            else
              IS_RC="false"
              echo "🚀 Creating stable release from tag: $TAG_NAME"
            fi
          else
            # 手动 dev 构建，使用 create-tag job 的输出
            TAG_NAME="${{ needs.create-tag.outputs.tag_name }}"
            IS_DEV="${{ needs.create-tag.outputs.is_dev }}"
            IS_RC="false"
            echo "🔧 Creating development release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT
          echo "is_rc=$IS_RC" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Prepare release assets (normalize updater metadata)
        shell: bash
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Create Release on Public Repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.is_dev == 'true' && format('Development Build {0}', steps.version.outputs.tag_name) || steps.version.outputs.tag_name }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.zip
            release-assets/**/*.yml
            release-assets/**/*.blockmap
          # Excluding source distributions that are not compiled binaries
          # Only upload actual distributables and updater metadata
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.version.outputs.is_dev == 'true' || contains(steps.version.outputs.tag_name, 'beta') || contains(steps.version.outputs.tag_name, 'alpha') || contains(steps.version.outputs.tag_name, 'rc') }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Upload to Tencent COS
        # 【变更】仅正式发布 v* 标签时上传 COS latest，dev 版本和 RC 版本都不上传
        if: steps.version.outputs.is_dev == 'false' && steps.version.outputs.is_rc == 'false' && env.TENCENT_SECRET_ID != '' && env.TENCENT_SECRET_KEY != ''
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: sudoclaw-download-1309794936
          COS_REGION: ap-beijing
        run: |
          echo "📦 Installing coscmd..."
          pip install coscmd

          echo "🔐 Configuring coscmd..."
          coscmd config -a $TENCENT_SECRET_ID -s $TENCENT_SECRET_KEY -b $COS_BUCKET -r $COS_REGION

          COS_PATH="sudowork/release/latest"

          echo "📤 Uploading all release assets to COS..."
          echo "Target path: $COS_PATH"

          # Upload all release assets to COS
          # - yml files: update url field to match latest naming, then upload
          # - installers: convert to latest naming format
          # - blockmaps: convert naming to match installer
          for file in release-assets/**/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")

              # yml files: update url/path to match latest naming
              if [[ "$filename" == *.yml ]]; then
                echo "  Processing yml: $filename"
                # Replace version numbers with 'latest' in url/path fields, normalize platform names
                # Sudowork-0.1.2-win-x64.exe -> Sudowork-latest-win-x64.exe
                # Sudowork-0.1.2-darwin-arm64.dmg -> Sudowork-latest-mac-arm64.dmg
                # For macOS yml files: change .zip to .dmg (electron-builder generates .zip but we upload .dmg)
                if [[ "$filename" == *"-mac.yml" ]]; then
                  # macOS yml: replace .zip with .dmg
                  sed -e 's/Sudowork-[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/Sudowork-latest/g' \
                      -e 's/-darwin-/-mac-/g' \
                      -e 's/-win32-/-win-/g' \
                      -e 's/\.zip/.dmg/g' \
                      "$file" > /tmp/updated.yml
                else
                  # Windows/Linux yml: just normalize version and platform names
                  sed -e 's/Sudowork-[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/Sudowork-latest/g' \
                      -e 's/-darwin-/-mac-/g' \
                      -e 's/-win32-/-win-/g' \
                      "$file" > /tmp/updated.yml
                fi
                coscmd upload /tmp/updated.yml "$COS_PATH/$filename" || echo "⚠️ Failed to upload $filename"
                continue
              fi

              # Installers (exe, dmg): convert to latest naming
              if [[ "$filename" =~ \.(exe|dmg)$ ]]; then
                latest_name=$(echo "$filename" | sed 's/[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/latest/' | sed 's/darwin/mac/' | sed 's/win32/win/')
                echo "  Uploading: $filename -> $latest_name"
                coscmd upload "$file" "$COS_PATH/$latest_name" || echo "⚠️ Failed to upload $filename"
                continue
              fi

              # Other files (blockmap, etc.): convert naming to match installer
              if [[ "$filename" =~ \.blockmap$ ]]; then
                latest_name=$(echo "$filename" | sed 's/[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/latest/' | sed 's/darwin/mac/' | sed 's/win32/win/')
                echo "  Uploading: $filename -> $latest_name"
                coscmd upload "$file" "$COS_PATH/$latest_name" || echo "⚠️ Failed to upload $filename"
                continue
              fi

              # Skip other files (zip, etc.)
              echo "  Skipping: $filename (not required for auto-update)"
            fi
          done

          echo "✅ Upload to COS completed"
          echo "📂 Files available at: https://$COS_BUCKET.cos.$COS_REGION.myqcloud.com/$COS_PATH/"

      - name: Cleanup Old Releases on Public Repo
        run: |
          IS_DEV="${{ steps.version.outputs.is_dev }}"

          if [ "$IS_DEV" = "true" ]; then
            # dev 版：保留最近 5 个，删除更早的
            KEEP=5
            FILTER='.[] | select(.isPrerelease == true) | .tagName'
          else
            # 正式版：保留最近 10 个，删除更早的
            KEEP=10
            FILTER='.[] | select(.isPrerelease == false) | .tagName'
          fi

          TO_DELETE=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName,isPrerelease \
            | jq -r "$FILTER" \
            | tail -n +$((KEEP + 1)))

          if [ -z "$TO_DELETE" ]; then
            echo "No old releases to clean up."
            exit 0
          fi

          echo "Deleting old releases:"
          echo "$TO_DELETE"
          echo "$TO_DELETE" | xargs -I{} gh release delete {} \
            --repo ${{ github.repository }} \
            --yes \
            --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # 【新增】正式发布后自动创建维护分支，为后续 Hotfix 提供基座
      - name: Create Maintenance Branch
        # 仅正式发布时创建（排除 dev 版本、RC 版本、hotfix 版本）
        if: steps.version.outputs.is_dev == 'false' && steps.version.outputs.is_rc == 'false' && !contains(steps.version.outputs.tag_name, '+')
        run: |
          # 配置 git 用户信息
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git

          # 提取主版本号作为分支名，如 v1.2.3 -> release-v1.2（统一使用 - 分隔符）
          VERSION="${{ steps.version.outputs.tag_name }}"
          VERSION_MAJOR_MINOR=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f1,2)
          BRANCH_NAME="release-v${VERSION_MAJOR_MINOR}"

          echo "=========================================="
          echo "Creating maintenance branch: $BRANCH_NAME"
          echo "=========================================="

          # 创建维护分支（如果已存在则跳过）
          git push origin HEAD:refs/heads/$BRANCH_NAME || echo "Branch $BRANCH_NAME already exists or no changes"

          echo "✅ Maintenance branch ready for hotfix development"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
