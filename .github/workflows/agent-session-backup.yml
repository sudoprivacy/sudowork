name: Agent session backup

on:
  pull_request:
    paths:
      - "apps/desktop/skills/_builtin/agent-session-backup/**"
      - ".github/workflows/agent-session-backup.yml"
  workflow_dispatch:

jobs:
  portable-backup:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s apps/desktop/skills/_builtin/agent-session-backup/scripts -p "test_*.py" -v
