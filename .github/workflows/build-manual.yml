name: Recover macOS v0.2.21

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: macos-v0.2.21-recovery
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify notarized macOS packages and publish
    runs-on: macos-15
    environment: release
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      RELEASE_TAG: v0.2.21
      SOURCE_SHA: 0ff4b21a6fcabc54ad39a84639d0ec1487c6c652
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python3 -m pip install coscmd pyyaml
      - name: Download successful builds from the original release source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_SHA']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          target = api('git/ref/tags/v0.2.21')['object']
          while target['type'] == 'tag':
              target = api(f"git/tags/{target['sha']}")['object']
          assert target['type'] == 'commit' and target['sha'] == source
          proof = []
          for arch, run_id in [('arm64', 36988670492), ('x64', 36988675323)]:
              run = api(f'actions/runs/{run_id}')
              assert run['status'] == 'completed' and run['conclusion'] == 'success', f'{arch} build not successful'
              assert run['path'] == '.github/workflows/build-manual.yml'
              artifacts = api(f'actions/runs/{run_id}/artifacts')['artifacts']
              matches = [a for a in artifacts if a['name'].startswith(f'macos-build-{arch}-') and not a['expired']]
              assert len(matches) == 1
              artifact = matches[0]
              suffix = artifact['name'].rsplit('-', 1)[1]
              assert re.fullmatch('[0-9a-f]{7,40}', suffix) and source.startswith(suffix), 'Unexpected source commit'
              target = pathlib.Path('build-artifacts') / f'macos-build-{arch}'
              target.mkdir(parents=True)
              subprocess.run(['gh', 'run', 'download', str(run_id), '--repo', repo, '--name', artifact['name'], '--dir', str(target)], check=True)
              proof.append({'arch': arch, 'run': run_id, 'artifactId': artifact['id'], 'sourceCommit': source})
          pathlib.Path('recovery-builds.json').write_text(json.dumps(proof, indent=2))
          PY
          mkdir -p build-artifacts/windows-build-x64
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-win-x64.*' --pattern latest.yml --dir build-artifacts/windows-build-x64
          bash apps/desktop/scripts/prepare-release-assets.sh build-artifacts release-assets
          bash apps/desktop/scripts/verify-release-assets.sh release-assets
      - name: Verify signatures and notarization tickets in ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail
          verify_app() {
            local app="$1"
            local arch="$2"
            test -d "$app"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.sudowork.app
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.2.21
            test "$(lipo -archs "$app/Contents/MacOS/Sudowork")" = "$arch"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          }
          for arch in arm64 x64; do
            expected="$arch"
            if [ "$arch" = x64 ]; then expected=x86_64; fi
            zip="release-assets/Sudowork-0.2.21-mac-${arch}.zip"
            dmg="release-assets/Sudowork-0.2.21-mac-${arch}.dmg"
            test -s "$zip"
            test -s "$dmg"
            test -s "${zip}.blockmap"
            unpacked="$RUNNER_TEMP/verify-zip-${arch}"
            ditto -x -k "$zip" "$unpacked"
            verify_app "$unpacked/Sudowork.app" "$expected"
            mount="$RUNNER_TEMP/verify-dmg-${arch}"
            mkdir -p "$mount"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
            trap 'hdiutil detach "$mount" || true' EXIT
            verify_app "$mount/Sudowork.app" "$expected"
            hdiutil detach "$mount"
            trap - EXIT
          done
      - name: Check current feeds before publishing
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, yaml
          base = 'https://sudowork-release-1309794936.cos.accelerate.myqcloud.com/sudowork/release/latest/'
          expected = 'zs2J5SXjpH/PrR8rY7QCNMKdzJLwpyphEELcnw0PeJktLfLM3Pux0HdEGcTQo96m2nRaUVCis3Buup3fiOdGHg=='
          for name in ['latest.yml', 'latest-mac.yml', 'arm64-mac.yml']:
              local = yaml.safe_load((pathlib.Path('release-assets') / name).read_text())
              assert str(local['version']) == '0.2.21'
              with urllib.request.urlopen(base + name, timeout=30) as r:
                  remote = yaml.safe_load(r.read())
              if name == 'latest.yml':
                  assert str(remote['version']) == '0.2.21'
                  assert remote['sha512'] == local['sha512'] == expected, 'Windows release changed'
              else:
                  assert tuple(map(int, str(remote['version']).split('.'))) < (0, 2, 21), 'A macOS publisher already advanced this feed; review before overwriting'
              print(name, 'current version:', remote['version'])
          PY
      - name: Publish verified macOS assets to GitHub
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/*-mac-x64.* release-assets/*-mac-arm64.* \
            release-assets/latest-mac.yml release-assets/arm64-mac.yml
      - name: Publish verified update feeds to COS
        shell: bash
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: sudowork-release-1309794936
          COS_PATH: sudowork/release/latest
          COS_PUBLIC_BASE_URL: https://sudowork-release-1309794936.cos.accelerate.myqcloud.com/sudowork/release/latest
        run: |
          set -euo pipefail
          coscmd config -a "$TENCENT_SECRET_ID" -s "$TENCENT_SECRET_KEY" -b "$COS_BUCKET" -e cos.accelerate.myqcloud.com
          cd apps/desktop
          bash scripts/publish-release-to-cos.sh ../../release-assets
      - name: Save recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-v0.2.21-recovery-evidence
          path: |
            recovery-builds.json
            release-assets/latest.yml
            release-assets/latest-mac.yml
            release-assets/arm64-mac.yml
