name: "✓PR Checks"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, dev]
  merge_group:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

env:
  BUN_INSTALL_REGISTRY: "https://registry.npmjs.org/"
  BUN_CONFIG_MAX_HTTP_REQUESTS: "32"

jobs:
  external-provider-contract:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: External Provider Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify the exact published sudostack artifact and semantic source lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-external-contract.mjs
          node scripts/check-task-contract.mjs
      - name: Reject independent local repins and generated drift
        run: node --test scripts/check-external-contract.test.mjs scripts/check-task-contract.test.mjs

  # Job 1: Skipped code quality checks (ESLint removed per requirement)

  # Job 2: Vault secrets unit tests — pure mock, no native deps
  unit-tests-secrets:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Secrets Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Run secrets unit tests
        # secretsGrpcOnly is a static source-code guard (refuses HTTP
        # secrets paths reintroducing the pre-PR-#733 bug that hit
        # external user 进二 on v0.2.7). Pure file reads, no native deps
        # — fits in this cheap unit-test job, not the heavy
        # pr-integration-smoke that spins up a real cluster.
        #
        # nexus-secret-resilient covers the single→batch fallback wrapper
        # that secretsApi.handlePut + pwdLoginService both call. Mocked,
        # no native deps either.
        run: bunx vitest run tests/unit/secrets/nexus-secret-client.test.ts tests/unit/secrets/secret-cache.test.ts tests/unit/secrets/nexus-secret-resilient.test.ts tests/unit/secrets/secretsApi.test.ts tests/integration/secretsGrpcOnly.integration.test.ts

  # Job 2b: Hub catalog empty-state differentiation tests
  unit-tests-hub:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Hub Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Run hub unit tests
        # hubErrors: typed error parser unit (mocked, no deps).
        # HubEmptyState: DOM test (jsdom) for the 3-way empty-state UI
        # that surfaces TOKEN_MISSING vs FETCH_FAILED vs actually-empty
        # — observability fix for the bug class where users (e.g. 进二
        # on v0.2.7) saw silent empty catalogs without any signal that
        # their skillhub token wasn't provisioned.
        run: bunx vitest run tests/unit/hubErrors.test.ts tests/unit/HubEmptyState.dom.test.tsx tests/unit/skillUpdateVersion.test.ts

  # Job 2b2: Prettier formatting gate. Root cause of the v0.2.16 nightly failure:
  # prettier was enforced ONLY at nightly (build-nightly Code Quality), never in
  # PR CI, so unformatted code merged freely to dev and broke the release build.
  # Gate the exact same check at PR time (same script as nightly) so dev stays
  # release-clean. Deterministic + fast — not the ESLint that was removed.
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Check Prettier formatting
        run: bun run format:check

  # Job 2b3: TypeScript type-check gate for the whole monorepo. The shared
  # renderer now lives in packages/renderer (outside apps/desktop's tsconfig),
  # so the SSOT `type:check` script checks BOTH apps/desktop AND
  # @sudowork/renderer. Previously PR CI had no tsc gate at all.
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      # Emit dist types for the workspace packages so apps/desktop's tsc can
      # resolve them via their `types` condition.
      - name: Build shared packages
        run: bun run build:packages

      - name: Type check (apps/desktop + packages/renderer)
        run: bun run type:check

      - name: Lint (packages/renderer)
        run: bun run --filter '@sudowork/renderer' lint

      - name: Format check (packages/renderer)
        run: bun run --filter '@sudowork/renderer' format:check

  # Job 2c: Conversation resource reaper regression tests
  unit-tests-conversation-reaper:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Conversation Reaper Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Run conversation reaper tests
        # Guards the conversation-lifecycle cleanup SSOT against regression:
        # reaper step order + workspace-deletion guard (never delete a user
        # asset), boot orphan sweeper (referenced kept / aged orphan swept /
        # fresh skipped), preset-uninstall routing through the reaper, and the
        # leaked-cache disposers (message timer, telemetry discard). All mocked
        # / tmp-dir based — no native deps or display. Encodes the behaviors
        # verified end-to-end against the live app.
        run: bunx vitest run tests/integration/conversationReaper.test.ts tests/integration/orphanWorkspaceSweeper.test.ts tests/integration/assistantHubUninstallReaper.test.ts tests/unit/conversationTrackerDiscard.test.ts tests/unit/messageDispose.test.ts

  # Job 2d: FULL test suite. Root cause of the v0.2.16 release being blocked by 87
  # broken tests on dev: PR CI only ran the hardcoded subsets above, never the whole
  # suite — so test-breaking merges (renamed APIs, moved modules, changed component
  # contracts) passed PR review and only surfaced at the release nightly. Gate the
  # entire suite here (same `vitest run` the nightly Code Quality job runs on Linux)
  # so dev stays release-clean and regressions are caught at PR time, not release time.
  unit-tests-full:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Full Unit Test Suite
            timeout: 20
            shard: 1/1
          # Match the VS 2022 toolchain selected by rebuildNativeModules.js.
          - os: windows-2022
            name: Full Unit Test Suite (Windows 1/3)
            # A cold install took 14m35s; preserve time for the complete suite
            # and the Electron ABI rebuild without changing test timeouts.
            timeout: 30
            shard: 1/3
          # A cold full run took 17m, mostly module imports and DOM setup.
          # Separate runners keep the complete suite within its step budget
          # without concurrent DOM workloads on the same machine.
          - os: windows-2022
            name: Full Unit Test Suite (Windows 2/3)
            timeout: 30
            shard: 2/3
          - os: windows-2022
            name: Full Unit Test Suite (Windows 3/3)
            timeout: 30
            shard: 3/3
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache verified libvips downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-cache/_libvips
          key: libvips-8.14.5-${{ runner.os }}-${{ runner.arch }}-integrity-v2

      - name: Verify libvips before dependency installation
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: node ../../.github/scripts/cache-sharp-libvips.mjs

      - name: Install dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: bun install --frozen-lockfile

      - name: Ensure Electron is installed for native SQLite tests
        run: node node_modules/electron/install.js

      - name: Setup MSBuild for native SQLite tests
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "17.0"

      - name: Rebuild SQLite for the desktop Electron ABI
        # CI postinstall normally skips this. The native SQLite suite launches
        # Electron, so a Node.js prebuild cannot satisfy its driver contract.
        env:
          SUDOWORK_FORCE_REBUILD: "1"
        run: node scripts/postinstall.js

      - name: Run full test suite
        timeout-minutes: 10
        run: bunx vitest run --shard=${{ matrix.shard }}

  # Job 3: Build test across all platforms (parallel with code-quality and unit-tests)
  build-test:
    name: Build Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        working-directory: apps/desktop
    # Steps read the per-platform values from env rather than matrix, so the
    # macOS jobs below, which cannot be matrix jobs, share these exact steps.
    env:
      MATRIX_PLATFORM: ${{ matrix.platform }}
      MATRIX_ARCH: ${{ matrix.arch }}
      MATRIX_BUILD_ARGS: ${{ matrix.build_args }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-x64"
            os: "windows-2022"
            arch: "x64"
            target: "--win"
            build_args: "--win --x64"
            unpacked_dir: "win-unpacked"
            timeout: 75
          - platform: "windows-arm64"
            os: "windows-2022"
            arch: "arm64"
            target: "--win"
            build_args: "--win --arm64"
            unpacked_dir: "win-arm64-unpacked"
            timeout: 75
          # Linux build disabled — no .deb target configured, snap requires snapcraft login
          # - platform: 'linux'
          #   os: 'ubuntu-latest'
          #   arch: 'x64'
          #   target: '--linux'
          #   build_args: '--linux --x64'
          #   unpacked_dir: 'linux-unpacked'

    steps: &build_test_steps
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup just
        uses: extractions/setup-just@v2
        with:
          just-version: "1.59.0"

      - name: Verify native macOS build architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_BUILD_ARCH: ${{ env.MATRIX_ARCH }}
        run: |
          node -e "if (process.arch !== process.env.EXPECTED_BUILD_ARCH) throw new Error('Expected ' + process.env.EXPECTED_BUILD_ARCH + ' runner; received ' + process.arch)"

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Install hook dependencies
        run: cd hook/node && bun install --no-frozen-lockfile

      - name: Install Linux dependencies
        if: env.MATRIX_PLATFORM == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      - name: Get Electron version
        id: electron-version
        shell: bash
        run: |
          ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')")
          echo "version=$ELECTRON_VERSION" >> $GITHUB_OUTPUT
          echo "Electron version: $ELECTRON_VERSION"

      # Restore Electron/Electron-Builder caches before install-app-deps
      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ env.MATRIX_PLATFORM }}-${{ env.MATRIX_ARCH }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ env.MATRIX_PLATFORM }}-${{ env.MATRIX_ARCH }}-
            electron-cache-${{ env.MATRIX_PLATFORM }}-

      - name: Cache status
        run: echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"

      - name: Rebuild native modules for Electron (non-Windows)
        if: "!startsWith(env.MATRIX_PLATFORM, 'windows')"
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Setup MSBuild (Windows only)
        if: startsWith(env.MATRIX_PLATFORM, 'windows')
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "17.0"

      - name: Build test (Windows x64)
        if: env.MATRIX_PLATFORM == 'windows-x64'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "BUILD TEST: ${{ env.MATRIX_PLATFORM }}"
          Write-Host "=========================================="
          just build-win-x64
          Write-Host "✓Build test passed for ${{ env.MATRIX_PLATFORM }}"
        env:
          SHAREONE_REVIEW_GITHUB_TOKEN: ${{ secrets.SHAREONE_REVIEW_GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          CI: true

      - name: Build test (Windows arm64)
        if: env.MATRIX_PLATFORM == 'windows-arm64'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "BUILD TEST: ${{ env.MATRIX_PLATFORM }}"
          Write-Host "=========================================="
          just build-win-arm64
          Write-Host "✓Build test passed for ${{ env.MATRIX_PLATFORM }}"
        env:
          SHAREONE_REVIEW_GITHUB_TOKEN: ${{ secrets.SHAREONE_REVIEW_GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          CI: true

      - name: Build test (non-Windows)
        if: "!startsWith(env.MATRIX_PLATFORM, 'windows')"
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD TEST: ${{ env.MATRIX_PLATFORM }}"
          echo "=========================================="
          node scripts/build-with-builder.js ${{ env.MATRIX_ARCH }} ${{ env.MATRIX_BUILD_ARGS }}
          echo "✓Build test passed for ${{ env.MATRIX_PLATFORM }}"
        env:
          SHAREONE_REVIEW_GITHUB_TOKEN: ${{ secrets.SHAREONE_REVIEW_GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          npm_config_arch: ${{ env.MATRIX_ARCH }}
          npm_config_target_arch: ${{ env.MATRIX_ARCH }}
          npm_config_runtime: electron
          npm_config_target: ${{ steps.electron-version.outputs.version }}
          npm_config_disturl: https://electronjs.org/headers
          CI: true

      - name: Verify packaged i18n assets
        run: bun run test:packaged:i18n

      - name: Verify build artifacts exist
        shell: bash
        run: |
          echo "=========================================="
          echo "VERIFY ARTIFACTS: ${{ env.MATRIX_PLATFORM }}"
          echo "=========================================="
          ls -lah out || true

          case "${{ env.MATRIX_PLATFORM }}" in
            windows-*)
              ls out/*.exe out/*latest*.yml >/dev/null
              ;;
            macos-*)
              ls out/*.dmg out/*.zip out/*latest*.yml >/dev/null
              ;;
            linux)
              ls out/*.AppImage out/*latest*.yml >/dev/null
              ;;
          esac

      - name: Silent install smoke test (Windows x64)
        if: env.MATRIX_PLATFORM == 'windows-x64'
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "SMOKE INSTALL: windows-x64"
          Write-Host "=========================================="

          $installer = Get-ChildItem -Path out -Filter "Sudowork-*-win-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer found in out/"
          }

          Write-Host "Using installer: $($installer.FullName)"
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(300000)) {
            $proc.Kill()
            throw "Silent install timed out after 5 minutes"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Silent install failed with exit code $($proc.ExitCode)"
          }

          $candidates = @(
            "$env:LOCALAPPDATA\\Programs\\Sudowork\\Sudowork.exe",
            "$env:ProgramFiles\\Sudowork\\Sudowork.exe",
            "$env:ProgramFiles(x86)\\Sudowork\\Sudowork.exe"
          )

          $installedExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installedExe) {
            throw "Silent install finished but app executable not found in expected locations"
          }

          Write-Host "Installed executable: $installedExe"

      - name: Skip executable smoke for Windows arm64 cross build
        if: env.MATRIX_PLATFORM == 'windows-arm64'
        shell: pwsh
        run: |
          Write-Host "Skipping runtime install smoke for windows-arm64: runner is windows-x64, cannot reliably execute arm64 installer."
          Get-ChildItem -Path out -Filter "Sudowork-*-win-*.exe" | Format-Table Name, Length

      - name: Install smoke test (macOS arm64)
        if: env.MATRIX_PLATFORM == 'macos-arm64'
        shell: bash
        run: python3 ../../scripts/smoke_install_macos.py --directory out

      - name: Skip executable smoke for macOS x64 cross build
        if: env.MATRIX_PLATFORM == 'macos-x64'
        shell: bash
        run: |
          echo "Skipping runtime launch smoke for macos-x64 cross build on arm64 runner."
          ls -lah out/*.dmg out/*.zip

      - name: Install smoke test (Linux)
        if: env.MATRIX_PLATFORM == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "SMOKE INSTALL: linux"
          echo "=========================================="

          APPIMAGE_FILE=$(ls out/*.AppImage | head -n 1)
          chmod +x "$APPIMAGE_FILE"
          "$APPIMAGE_FILE" --appimage-extract-and-run --version || true

  # Job 4: Test release scripts (fast, no build required)

  build-test-macos-arm64:
    # macOS runners are the scarcest pool, shared by every sudoprivacy repo.
    # PRs into `dev` skip this job: `dev` lands only through the merge queue,
    # which runs it on the exact commit that becomes `dev`. A job skipped by
    # `if` still reports this required check, without allocating a runner.
    # PRs into `main` have no queue behind them, so they always run it.
    # It must stay a non-matrix job: a skipped matrix job reports the
    # unexpanded name, so the required check would never be satisfied.
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'dev' }}
    name: Build Test (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    env:
      MATRIX_PLATFORM: macos-arm64
      MATRIX_ARCH: arm64
      MATRIX_BUILD_ARGS: "--mac --arm64"
    steps: *build_test_steps

  build-test-macos-x64:
    # macOS runners are the scarcest pool, shared by every sudoprivacy repo.
    # PRs into `dev` skip this job: `dev` lands only through the merge queue,
    # which runs it on the exact commit that becomes `dev`. A job skipped by
    # `if` still reports this required check, without allocating a runner.
    # PRs into `main` have no queue behind them, so they always run it.
    # It must stay a non-matrix job: a skipped matrix job reports the
    # unexpanded name, so the required check would never be satisfied.
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'dev' }}
    name: Build Test (macos-x64)
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    env:
      MATRIX_PLATFORM: macos-x64
      MATRIX_ARCH: x64
      MATRIX_BUILD_ARGS: "--mac --x64"
    steps: *build_test_steps
  release-script-test:
    name: Release Script Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create mock build artifacts
        shell: bash
        run: bash scripts/create-mock-release-artifacts.sh build-artifacts

      - name: Run prepare-release-assets script
        shell: bash
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Validate script output
        shell: bash
        run: bash scripts/verify-release-assets.sh release-assets

      - name: Test release validation regressions
        run: python3 scripts/test-release-verification.py

      - name: Test candidate promotion against local Git remotes
        run: python3 scripts/test-candidate-promotion.py

      - name: Test macOS distribution lifecycle
        run: python3 -m unittest discover -s ../../scripts -p 'test_*macos*.py'
