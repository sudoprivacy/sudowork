name: PR Cold Start Smoke

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: pr-cold-start-smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cold-start-smoke:
    name: Cold Start Smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: windows-x64
            os: windows-2022
          - platform: macos-arm64
            os: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download the pinned Sudocode frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dev/download-acp-test-runtime.mjs
      - name: Verify shared cold start, signed plugins and durable recovery
        env:
          SUDOWORK_RUNTIME_E2E: "1"
          RUST_LOG: info
        run: bunx vitest run tests/integration/vault-signed-download.integration.test.ts
