name: Branch Windows Build

permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - ci/local-kb-windows-build

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  UV_DEFAULT_INDEX: 'https://pypi.org/simple/'

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ci/local-kb-windows-build
          submodules: recursive

      - name: Get commit hash
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Commit: $SHORT"

      - name: Initialize ai-dev-browser submodule
        shell: bash
        run: |
          git submodule sync --recursive vendor/ai-dev-browser
          git submodule update --init --force --depth=1 --recursive vendor/ai-dev-browser
          git submodule status --recursive vendor/ai-dev-browser
          count=$(find vendor/ai-dev-browser/ai_dev_browser -name '*.py' 2>/dev/null | wc -l | tr -d ' ')
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::ai-dev-browser package is empty or missing"
            exit 1
          fi
          echo "ai-dev-browser package present: $count .py files"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Electron artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-windows-x64-x64-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-windows-x64-x64-
            electron-cache-windows-x64-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --no-frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Install hook dependencies
        run: cd hook/node && bun install --no-frozen-lockfile

      - name: Build safety hook
        run: bun run hook:build

      - name: Download CLI resources
        shell: bash
        run: |
          node scripts/download-node.js win32-x64
          node scripts/download-nexus-vfs.js
          node scripts/download-scode.js win32-x64
          node scripts/download-claude-code.js
          node scripts/download-bdpan.js win32-x64
          node scripts/download-mcporter.js
          node scripts/download-shareone.js
        env:
          npm_config_arch: x64
          npm_config_platform: win32

      - name: Setup Windows native dependencies
        run: bun install --global node-gyp

      - name: Setup Windows build environment
        shell: pwsh
        run: |
          "WindowsTargetPlatformVersion=10.0.19041.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Rebuild native modules for Electron
        shell: pwsh
        run: |
          $arch = "x64"
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()
          Write-Host "Rebuilding native modules for Electron $electronVer ($arch)"

          try {
            bun x --yes prebuild-install --runtime=electron --target=$electronVer --platform=win32 --arch=$arch --force
          } catch {
            Write-Host "prebuild-install failed: $_"
          }

          $sqliteNode = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $sqliteNode)) {
            bunx electron-rebuild -f -w better-sqlite3
          }
          if (-not (Test-Path $sqliteNode)) {
            throw "better-sqlite3 native module not found at $sqliteNode"
          }
        env:
          npm_config_runtime: electron
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_disturl: https://electronjs.org/headers
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build nexus-napi native module
        run: bun run build:native

      - name: Build with electron-builder
        shell: pwsh
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          _WIN32_WINNT: 0x0A00
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node scripts/build-with-builder.js x64 --win --x64

      - name: Verify packaged i18n assets
        run: bun run test:packaged:i18n

      - name: List build artifacts
        if: success() || failure()
        shell: bash
        run: |
          if [ -d "out" ]; then
            ls -lh out/ || true
          else
            echo "No out directory found"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-x64-${{ steps.commit.outputs.short }}
          path: |
            out/*.exe
            out/*.msi
            out/*.zip
            out/*.yml
            out/*.blockmap
          if-no-files-found: error
          retention-days: 7
