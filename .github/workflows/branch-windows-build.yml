name: Branch Windows Build

permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - ci/local-kb-windows-build

jobs:
  build-pipeline:
    name: Build Windows x64
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: '{"include":[{"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}]}'
      ref: ci/local-kb-windows-build
      skip_code_quality: true
      append_commit_hash: true
    secrets: inherit
