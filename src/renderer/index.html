<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../../resources/sudowork-icon-dark.svg" />
    <title>__BRAND_DISPLAY_NAME__</title>
    <script>
      // 强制亮色：主题切换已移除，固定 data-theme=light / Force light: theme switching removed
      document.documentElement.setAttribute('data-theme', 'light');
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      // 强制亮色：固定 arco-theme=light / Force light: pin arco-theme=light
      document.body.setAttribute('arco-theme', 'light');
    </script>
    <div id="root"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
