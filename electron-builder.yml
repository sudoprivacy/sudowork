appId: com.sudowork.app
productName: Sudowork
executableName: Sudowork
copyright: Copyright © 2026 北京数牍科技有限公司

protocols:
  - name: Sudowork Protocol
    schemes:
      - sudowork

asar:
  smartUnpack: true

# Only ship Electron locale.pak files for the languages we actually support
# in the renderer (English and Simplified Chinese).
# Drops ~25MB of unused locale.pak files (hi, ta, te, ml, kn, mr, gu, bn, ...).
# Names must match Electron's .lproj directory names exactly — underscore form,
# not BCP-47 dashes (electron-builder compares against path.basename(dir, ".lproj")).
# If a Hong Kong / Taiwan user variant ships in the future, add `zh_TW` back.
electronLanguages:
  - en
  - zh_CN

directories:
  output: out
  buildResources: resources

files:
  # electron-vite build output (main process + preload + renderer)
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  # Static resources — use explicit directory inclusion to prevent resource loss
  - public/**/*
  - rules/**/*
  - skills/**/*
  - assistant/**/*
  # ai-dev-browser Python package (browser skill runtime)
  - vendor/ai-dev-browser/ai_dev_browser/**/*
  - package.json
  # Rust napi addon (nexus gRPC client)
  - native/nexus-napi/*.node
  - native/nexus-napi/index.js
  - native/nexus-napi/index.d.ts
  # Native modules and their runtime dependencies
  - node_modules/better-sqlite3/**/*
  - node_modules/bcrypt/**/*
  - node_modules/node-pty/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/@mapbox/**/*
  - node_modules/detect-libc/**/*
  - node_modules/prebuild-install/**/*
  - node_modules/node-gyp-build/**/*
  - node_modules/bindings/**/*
  # CLI dependencies (needed by nested jackspeak/glob)
  - node_modules/@isaacs/cliui/**/*
  - node_modules/ansi-regex/**/*
  - node_modules/ansi-styles/**/*
  - node_modules/strip-ansi/**/*
  - node_modules/wrap-ansi/**/*
  - node_modules/string-width/**/*
  - node_modules/eastasianwidth/**/*
  - node_modules/emoji-regex/**/*
  # open library - needs to be external for Windows asar compatibility
  - node_modules/open/**/*
  - node_modules/default-browser/**/*
  - node_modules/default-browser-id/**/*
  - node_modules/run-applescript/**/*
  - node_modules/bundle-name/**/*
  # @office-ai packages and their dependencies
  - node_modules/@office-ai/**/*
  # axios/form-data dependencies (required by @office-ai packages)
  - node_modules/form-data/**/*
  - node_modules/follow-redirects/**/*
  - node_modules/mime-types/**/*
  - node_modules/mime-db/**/*
  - node_modules/axios/**/*
  - node_modules/proxy-from-env/**/*
  # tree-sitter WASM dependencies
  - node_modules/web-tree-sitter/**/*
  - node_modules/tree-sitter-bash/**/*
  # CRITICAL: Exclude ALL tree-sitter native binaries to prevent signing issues
  - '!**/node_modules/tree-sitter-*/prebuilds/**'
  - '!**/node_modules/tree-sitter-*/build/**'
  - '!**/node_modules/tree-sitter-*/src/**'
  - '!**/node_modules/tree-sitter-*/**/*.node'
  - '!**/node_modules/tree-sitter-*/**/*.obj'
  - '!**/node_modules/tree-sitter-*/**/*.o'
  - '!**/node_modules/tree-sitter-*/**/*.cc'
  - '!**/node_modules/tree-sitter-*/**/*.c'
  # Exclude dev/test/example dirs in shipped node_modules.
  # NOTE: deliberately not excluding LICENSE/LICENCE/COPYING/NOTICE/PATENTS
  # (electron-builder keeps those by default — they're load-bearing for compliance).
  #
  # IMPORTANT — only top-level package dir, NOT nested under dist/:
  # Use `node_modules/*/X/**` (single segment), not `node_modules/**/X/**`.
  # The latter blew up the `yaml` package because `yaml/dist/doc/` is
  # runtime source (Composer requires '../doc/directives.js'), not docs.
  # Deliberately NOT excluding: docs/doc/documentation/website/fixtures —
  # too many packages use these as runtime source paths (yaml, several
  # OpenTelemetry packages, etc.).
  - '!**/node_modules/*/{test,tests,__tests__,__mocks__,coverage,spec,specs}/**'
  - '!**/node_modules/*/{example,examples,demo,demos,sample,samples}/**'
  - '!**/node_modules/*.d.ts'
  - '!**/node_modules/.bin'
  # Markdown / changelog / contributing
  - '!**/node_modules/**/*.{md,markdown}'
  - '!**/node_modules/**/{CHANGELOG,HISTORY,CONTRIBUTING,AUTHORS,CONTRIBUTORS,UPGRADING,SECURITY,CODE_OF_CONDUCT}*'
  # Source maps (we don't debug shipped libs)
  - '!**/node_modules/**/*.{js,jsx,ts,tsx,cjs,mjs}.map'
  - '!**/node_modules/**/*.d.ts.map'
  # Nested lockfiles & package-manager config
  - '!**/node_modules/**/{yarn.lock,pnpm-lock.yaml,package-lock.json,bun.lockb,bun.lock,.npmrc,.yarnrc,.yarnrc.yml}'
  # IDE / CI / linting metadata
  - '!**/node_modules/**/.{github,gitlab,vscode,idea,circleci,husky}/**'
  - '!**/node_modules/**/{.eslintrc,.prettierrc,.editorconfig,.babelrc,.travis,.gitlab-ci,.releaserc,.gitattributes,.gitignore,.dockerignore}*'
  - '!**/node_modules/**/{jest,vitest,vite,rollup,webpack,tsup,esbuild,tsconfig.build,tsconfig.test}.config.*'
  # TypeScript build artifacts
  - '!**/node_modules/**/*.tsbuildinfo'
  - '!**/node_modules/**/*.flow'
  - '!**/node_modules/**/.flowconfig'
  # Exclude system files
  - '!**/{.DS_Store,.git,.gitignore,.gitattributes}'
  - '!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}'
  - '!**/{appveyor.yml,.travis.yml,circle.yml}'
  - '!**/{npm-debug.log,yarn.lock,.yarn-metadata.json,yarn-error.log}'
  # Exclude large packages
  - '!**/node_modules/{@emnapi}/**'
  - '!**/node_modules/@anthropic-ai/claude-code/vendor/**'
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk/vendor/**'
  # Exclude JAR files and JNI libraries that cause notarization issues
  - '!**/*.jar'
  - '!**/*.jnilib'
  # Exclude all vendor directories to prevent unsigned binaries
  - '!**/node_modules/*/vendor/**'
  - '!**/node_modules/@*/*/vendor/**'
  # Re-include vendor dirs for native modules that need them (if any)
  - 'node_modules/better-sqlite3/vendor/**'
  - 'node_modules/bcrypt/vendor/**'
  - 'node_modules/node-pty/vendor/**'
  # Exclude vite source maps
  - '!**/*.map'
  # Exclude syntax highlighter languages (keep common ones)
  - '!**/out/**/react-syntax-highlighter_languages_highlight_*'
  - 'out/**/react-syntax-highlighter_languages_highlight_{javascript,typescript,python,java,cpp,c,html,css,json,xml,yaml,shell,bash,dockerfile,sql,markdown,go,rust,php}'
  # Ensure vendor chunks from manual splitting are included
  - 'out/renderer/**/vendor-*.js'
  # Explicitly exclude source code directories
  - '!src/**/*'
  - '!electron.vite.config.ts'
  - '!tsconfig.json'
  - '!scripts/**/*'
  - '!vitest.config.ts'
  - '!uno.config.ts'

extraResources:
  - from: public
    to: .
  - from: resources/app.ico
    to: app.ico
  - from: resources/app.png
    to: app.png
  - from: resources/upload_skill_default.svg
    to: upload_skill_default.svg
  - from: THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  # Safety hook for Sudoclaw gateway interception
  - from: hook/node/dist/hook.js
    to: hook.js
  - from: hook/python/dist/hook-0.0.1-py3-none-any.whl
    to: hook-0.0.1-py3-none-any.whl
  - from: hook/python/pythonpath/sitecustomize.py
    to: pythonpath/sitecustomize.py
  # sudowork-owned aidb dispatcher (bash + cmd) — installed to
  # ~/.nexus/sudoclaw/bin/ at startup and put on PATH so LLM can write
  # `aidb <tool>` instead of `python -m ai_dev_browser.tools.<tool>`.
  - from: resources/sudoclaw-bin
    to: sudoclaw-bin
  # Shared voice-transcription helper (SILK→wav + CPU ASR). Run by the local
  # TranscriptionService engine via the provisioned Python runtime.
  - from: resources/transcription
    to: transcription
  # F1 pwd-login filler (vault-read password via stdin → ai-dev-browser fill +
  # vision-model captcha). Spawned by pwdLoginService.dispatchPwdFill.
  - from: resources/pwdLogin
    to: pwdLogin
  # CLI tools (bundled at build time via scripts/download-*.js)
  # NOTE: claude-code.tgz is deliberately NOT bundled — users install Claude
  # Code CLI separately (https://claude.com/code). At runtime, the Claude agent
  # resolves `claude` from PATH via the ACP bridge (see acpConnectors.ts).
  # Other agents (codex, gemini, sudocode, etc.) are unaffected.
  - from: resources/shareone.tgz
    to: shareone.tgz
  - from: resources/mcporter.tgz
    to: mcporter.tgz
  # sudowork-browser MCP server bundle (esbuild output from
  # scripts/build-browser-mcp.js). Claude Code launches this as a stdio MCP
  # subprocess after sudowork registers it in ~/.claude.json at first run.
  - from: resources/sudowork-browser-mcp/index.js
    to: sudowork-browser-mcp/index.js
  # Nexus binary - versioned, optional (may not be available for all platforms)
  # Copy from the resources directory with filters; using a glob in `from`
  # is not reliable for electron-builder file-set matching.
  - from: resources
    to: .
    filter:
      - v*-nexusd-cluster-macos-*
  # Scode binary - versioned, optional
  - from: resources
    to: .
    filter:
      - v*-scode-macos-*

win:
  legalTrademarks: Copyright © 2026 北京数牍科技有限公司
  target:
    - nsis
    - zip
  #    - msi
  icon: resources/app.ico # Use the checked-in Windows icon resource for executable metadata/icon patching
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  extraResources:
    # Node.js runtime for Windows (zip format)
    - from: resources/node-win32-${arch}.zip
      to: node-win32-${arch}.zip
    # bdpan installer for Windows (bundled at build time)
    - from: resources/bdpan-installer-windows-${arch}.exe
      to: bdpan-installer-windows-${arch}.exe
    # Nexus binary for Windows - versioned
    - from: resources
      to: .
      filter:
        - v*-nexusd-cluster-windows-*
    # Scode binary for Windows - versioned
    - from: resources
      to: .
      filter:
        - v*-scode-windows-*

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  include: scripts/installer.nsh
  # Modern visual branding — BMP images generated by scripts/generate-installer-images.js
  installerSidebar: resources/installerSidebar.bmp
  uninstallerSidebar: resources/installerSidebar.bmp
  installerHeader: resources/installerHeader.bmp
  installerIcon: resources/app.ico
  uninstallerIcon: resources/app.ico

mac:
  target:
    - dmg
    - zip
  icon: resources/app.icns
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.plist
  entitlementsInherit: entitlements.plist
  extraResources:
    # Node.js runtime for macOS (tar.gz format)
    - from: resources/node-darwin-${arch}.tar.gz
      to: node-darwin-${arch}.tar.gz
    # bdpan installer for macOS (arch-specific binary, bundled at build time)
    - from: resources/bdpan-installer-darwin-${arch}
      to: bdpan-installer-darwin-${arch}

dmg:
  # Use UDZO format which is more reliable on CI
  format: UDZO
  # Disable internet-enabled DMG to avoid network issues
  internetEnabled: false
  # Simple window settings to avoid layout issues
  window:
    width: 540
    height: 380
  # Contents positioning
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

afterPack: scripts/afterPack.js
afterSign: scripts/afterSign.js

npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false

asarUnpack:
  # ai-dev-browser Python package must live on the real filesystem (not inside
  # app.asar) so resolveAiDevBrowserPackageDir() can junction it into the browser
  # skill dir and Python can import it. Without this it ships packed in app.asar,
  # the junction never gets created, and `import ai_dev_browser` fails on every
  # packaged install.
  - 'vendor/ai-dev-browser/**/*'
  - 'native/nexus-napi/*.node'
  # index.js must sit next to the unpacked .node so that
  # require(app.asar.unpacked/native/nexus-napi) resolves (see nexus-vfs-client.ts)
  - 'native/nexus-napi/index.js'
  - '**/node_modules/better-sqlite3/**/*'
  - '**/node_modules/bcrypt/**/*'
  - '**/node_modules/node-pty/**/*'
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
  - '**/node_modules/@mapbox/**/*'
  - '**/node_modules/detect-libc/**/*'
  - '**/node_modules/prebuild-install/**/*'
  - '**/node_modules/node-gyp-build/**/*'
  - '**/node_modules/bindings/**/*'
  # open library and dependencies - needed for Windows asar compatibility
  - '**/node_modules/open/**/*'
  - '**/node_modules/default-browser/**/*'
  - '**/node_modules/default-browser-id/**/*'
  - '**/node_modules/run-applescript/**/*'
  - '**/node_modules/bundle-name/**/*'
  # tree-sitter WASM files need to be unpacked for fs.readFile access
  - '**/node_modules/web-tree-sitter/**/*'
  - '**/node_modules/tree-sitter-bash/**/*'
  # Builtin resources need to be unpacked for fs.readdir with withFileTypes
  # Required for Homebrew installations where asar paths may have issues
  - 'rules/**/*'
  - 'skills/**/*'
  # ai-dev-browser Python package must live in app.asar.unpacked: the runtime
  # resolver (resolveAiDevBrowserPackageDir) only looks under app.asar.unpacked,
  # and a Python package can't be executed/symlinked from inside the asar.
  - 'vendor/ai-dev-browser/**/*'

# Compression level: normal for faster builds, maximum for smallest size
# Note: electron-builder doesn't support YAML template syntax for env vars
# The build script sets ELECTRON_BUILDER_COMPRESSION_LEVEL env var which takes precedence
compression: maximum
removePackageScripts: true
electronDownload:
  cache: .cache

publish:
  provider: github
  owner: sudoprivacy
  repo: sudowork
  publishAutoUpdate: true
  releaseType: release
